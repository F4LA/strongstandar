<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Strong Standard — Voucher Program Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #080D1A;
    --navy-mid: #0f1729;
    --navy-light: #1a2540;
    --steel-mid: #2278AC;
    --steel-light: #3899CC;
    --steel-pale: #1a3a52;
    --gold: #C9A84C;
    --gold-pale: rgba(201,168,76,0.1);
    --green: #2ECC71;
    --green-pale: rgba(46,204,113,0.1);
    --red: #E74C3C;
    --red-pale: rgba(231,76,60,0.1);
    --text: #E8EEF4;
    --text-muted: #6B85A0;
    --text-dim: #3d5570;
    --border: rgba(56,153,204,0.15);
    --border-bright: rgba(56,153,204,0.35);
    --card-bg: rgba(15,23,41,0.8);
    --header-bg: rgba(8,13,26,0.9);
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }
  [data-theme="light"] {
    --navy: #F0F4FA;
    --navy-mid: #FFFFFF;
    --navy-light: #DDE4EF;
    --steel-mid: #1a68a0;
    --steel-light: #2278AC;
    --steel-pale: #b8d4e8;
    --gold: #a07820;
    --gold-pale: rgba(160,120,32,0.08);
    --green: #1a9e55;
    --green-pale: rgba(26,158,85,0.08);
    --red: #c0392b;
    --red-pale: rgba(192,57,43,0.08);
    --text: #0D1B2A;
    --text-muted: #3d5a7a;
    --text-dim: #7a9ab8;
    --border: rgba(34,120,172,0.18);
    --border-bright: rgba(34,120,172,0.40);
    --card-bg: rgba(255,255,255,0.95);
    --header-bg: rgba(240,244,250,0.95);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--navy); color: var(--text); font-family: var(--font-body); line-height: 1.6; }
  a { text-decoration: none; color: inherit; }
  button { font-family: inherit; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--steel-light); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *{ animation:none !important; transition:none !important; } }

  /* ── HEADER ── */
  .header {
    position: sticky; top: 0; z-index: 50; padding: 20px 40px; min-height: 76px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
    border-bottom: 1px solid var(--border); background: var(--header-bg); backdrop-filter: blur(10px);
  }
  .header-left { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  .logo { font-family: var(--font-display); font-size: 22px; letter-spacing: 3px; color: var(--steel-light); }
  .logo span { color: var(--text-muted); font-size: 12px; letter-spacing: 2px; font-family: var(--font-body); font-weight: 400; display: block; }
  .header-divider { width: 1px; height: 32px; background: var(--border); }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .last-updated { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
  .refresh-btn {
    background: var(--navy-light); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 14px; color: var(--text-muted); font-size: 12px; font-family: var(--font-body);
    transition: all 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .refresh-btn:hover { border-color: var(--steel-mid); color: var(--steel-light); }
  .theme-toggle {
    background: var(--navy-light); border: 1px solid var(--border); border-radius: 20px;
    padding: 5px 12px; color: var(--text-muted); font-size: 13px;
    transition: all 0.2s; display: flex; align-items: center; gap: 6px; user-select: none;
  }
  .theme-toggle:hover { border-color: var(--steel-mid); color: var(--steel-light); }

  /* ── MAIN ── */
  .main { max-width: 1300px; margin: 0 auto; padding: 32px 40px; }

  .page-hero { margin-bottom: 24px; display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .page-title { font-family: var(--font-display); font-size: 40px; letter-spacing: 3px; color: var(--text); line-height: 1; }
  .page-sub { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 1px; margin-top: 6px; }

  .stats-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 16px; margin-bottom: 28px; }
  @media (max-width: 700px) { .stats-grid { grid-template-columns: 1fr; } }
  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px; position: relative; overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(56,153,204,0.4), transparent);
  }
  .stat-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
  .stat-value { font-family: var(--font-display); font-size: 34px; letter-spacing: 1px; color: var(--text); line-height: 1; }

  .toolbar { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .search-input {
    flex: 1; min-width: 220px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; color: var(--text); font-family: var(--font-body); font-size: 13px; outline: none;
  }
  .search-input:focus { border-color: var(--steel-mid); }
  .search-input::placeholder { color: var(--text-dim); }

  .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th {
    text-align: left; padding: 12px 16px; font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap;
    position: sticky; top: 0; background: var(--card-bg);
  }
  tbody td { padding: 14px 16px; border-bottom: 1px solid var(--border); vertical-align: top; color: var(--text); }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(56,153,204,0.05); }
  .cell-name { font-weight: 600; }
  .cell-muted { color: var(--text-muted); font-size: 12px; font-family: var(--font-mono); }
  .cell-wide { max-width: 320px; white-space: normal; }
  .pill {
    display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    letter-spacing: 0.3px;
  }
  .pill.yes { background: var(--green-pale); color: var(--green); }
  .pill.no { background: var(--red-pale); color: var(--red); }
  .pill.unknown { background: var(--navy-light); color: var(--text-muted); }

  .empty-state, .error-state, .loading-state {
    padding: 60px 24px; text-align: center; color: var(--text-muted); font-size: 13px;
  }
  .error-state { color: var(--red); }
  .loading-note { font-size: 12px; color: var(--text-dim); font-family: var(--font-mono); margin-top: 8px; }
</style>

<div class="header">
  <div class="header-left">
    <div class="logo">STRONG STANDARD<span>VOUCHER PROGRAM · NOMINATIONS</span></div>
    <div class="header-divider"></div>
    <div class="last-updated" id="last-updated">—</div>
  </div>
  <div class="header-right">
    <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark mode">
      <span id="theme-icon">☀️</span><span id="theme-label">Light</span>
    </button>
    <button class="refresh-btn" onclick="loadData(true)">↻ Refresh</button>
  </div>
</div>

<div class="main">
  <div class="page-hero">
    <div>
      <div class="page-title">NOMINATIONS</div>
      <div class="page-sub">Read-only view · Module 1</div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Total Nominations</div>
      <div class="stat-value" id="stat-total">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Not Yet Scored</div>
      <div class="stat-value" id="stat-unscored">—</div>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" id="search-input" placeholder="Search by referrer or friend name…" oninput="renderTable()">
  </div>

  <div class="panel">
    <div class="table-wrap" id="table-wrap">
      <div class="loading-state" id="loading-state">Loading nominations…</div>
    </div>
  </div>
</div>

<script>
  // Live data source: Strong Standard - Voucher Program Nominations
  // https://docs.google.com/spreadsheets/d/1n5IXdQv4UDuag5X7QAK-7mM2EA7N3i0u5k0RONv0_BE/edit
  // NOTE: this sheet must be shared as "Anyone with the link — Viewer" for the
  // gviz read below to work client-side (same setup as affiliate-dashboard / invoices-payments-dashboard).
  const SHEET_ID = '1n5IXdQv4UDuag5X7QAK-7mM2EA7N3i0u5k0RONv0_BE';

  // Column order as defined in the sheet header row:
  // 0 Timestamp | 1 Referrer Name | 2 Friend Name | 3 Friend Email | 4 Friend Phone |
  // 5 Relationship to Friend | 6 Why Good Fit | 7 Talked to Them & Interested Now (open text) |
  // 8 AI Score - Commitment/Mindset | 9 AI Score - Goal/Situation Fit | 10 AI Score - Payment Capacity |
  // 11 AI Total Score | 12 AI Rationale | 13 Status | 14 Coupon Code | 15 Redeemed (Y/N) | 16 Outcome

  let allRows = [];

  async function fetchSheet(){
    // No &sheet= param -> defaults to the first tab in the spreadsheet.
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
    const res = await fetch(url);
    const text = await res.text();
    const jsonStart = text.indexOf('{');
    const jsonEnd = text.lastIndexOf('}');
    const json = JSON.parse(text.substring(jsonStart, jsonEnd + 1));
    if (!json.table || !json.table.rows) return [];
    return json.table.rows.map(r => (r.c || []).map(c => (c ? c.v : null)));
  }

  function escapeHtml(str){
    return (str || '').toString()
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderTable(){
    const wrap = document.getElementById('table-wrap');
    const q = (document.getElementById('search-input').value || '').trim().toLowerCase();

    const filtered = allRows.filter(row => {
      if (!q) return true;
      const referrer = (row[1] || '').toString().toLowerCase();
      const friend = (row[2] || '').toString().toLowerCase();
      return referrer.includes(q) || friend.includes(q);
    });

    if (filtered.length === 0){
      wrap.innerHTML = `<div class="empty-state">${allRows.length === 0 ? 'No nominations yet.' : 'No matches for that search.'}</div>`;
      return;
    }

    const rowsHtml = filtered.map(row => {
      const timestamp = row[0] ? escapeHtml(row[0]) : '—';
      const referrer = escapeHtml(row[1]);
      const friend = escapeHtml(row[2]);
      const email = escapeHtml(row[3]);
      const phone = escapeHtml(row[4]);
      const relationship = escapeHtml(row[5]);
      const whyFit = escapeHtml(row[6]);
      const talkedInterested = escapeHtml(row[7]);
      return `<tr>
        <td class="cell-muted">${timestamp}</td>
        <td class="cell-name">${referrer || '—'}</td>
        <td class="cell-name">${friend || '—'}</td>
        <td class="cell-muted">${email || '—'}</td>
        <td class="cell-muted">${phone || '—'}</td>
        <td>${relationship || '—'}</td>
        <td class="cell-wide">${whyFit || '—'}</td>
        <td class="cell-wide">${talkedInterested || '—'}</td>
      </tr>`;
    }).join('');

    wrap.innerHTML = `<table>
      <thead>
        <tr>
          <th>Submitted</th>
          <th>Referrer</th>
          <th>Friend</th>
          <th>Email</th>
          <th>Phone</th>
          <th>Relationship</th>
          <th>Why Good Fit</th>
          <th>Talked to Them About It</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>`;
  }

  function updateStats(){
    const total = allRows.length;
    const unscored = allRows.filter(r => !r[11]).length;
    document.getElementById('stat-total').textContent = total;
    document.getElementById('stat-unscored').textContent = unscored;
  }

  async function loadData(isManualRefresh){
    const wrap = document.getElementById('table-wrap');
    if (isManualRefresh){
      wrap.innerHTML = '<div class="loading-state">Refreshing…</div>';
    }
    try {
      allRows = await fetchSheet();
      updateStats();
      renderTable();
      document.getElementById('last-updated').textContent =
        'Updated ' + new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute: '2-digit'});
    } catch (e){
      console.error(e);
      wrap.innerHTML = '<div class="error-state">Could not load the sheet. Make sure it is shared as "Anyone with the link — Viewer".</div>';
      document.getElementById('last-updated').textContent = 'Could not refresh data';
    }
  }

  function toggleTheme(){
    const html = document.documentElement;
    const isDark = html.getAttribute('data-theme') === 'dark';
    const next = isDark ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    document.getElementById('theme-icon').textContent = isDark ? '🌙' : '☀️';
    document.getElementById('theme-label').textContent = isDark ? 'Dark' : 'Light';
    localStorage.setItem('ss_voucher_theme', next);
  }

  (function(){
    const savedTheme = localStorage.getItem('ss_voucher_theme');
    if (savedTheme){
      document.documentElement.setAttribute('data-theme', savedTheme);
      document.getElementById('theme-icon').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
      document.getElementById('theme-label').textContent = savedTheme === 'dark' ? 'Light' : 'Dark';
    }
    loadData(false);
  })();
</script>
</body>
