<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Creator — Strong Standard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy:        #080D1A;
      --navy-2:      #0D1526;
      --navy-3:      #111C30;
      --navy-4:      #17243B;
      --steel:       #1A5F8A;
      --steel-mid:   #2278AC;
      --steel-light: #3899CC;
      --steel-glow:  rgba(34,120,172,0.15);
      --white:       #FFFFFF;
      --off-white:   #EEF3F7;
      --muted:       #8A9BB0;
      --faint:       #4A5A6E;
      --gold:        #C8A96E;
      --success:     #3DD68C;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body:    'DM Sans', sans-serif;
      --r-sm: 6px; --r-md: 12px; --r-lg: 20px; --r-full: 9999px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { color-scheme: dark; }
    body {
      font-family: var(--font-body);
      background: var(--navy);
      color: var(--off-white);
      min-height: 100vh;
      padding: 40px 20px 80px;
    }

    /* ── LAYOUT ── */
    .wrapper {
      max-width: 760px;
      margin: 0 auto;
    }

    /* ── HEADER ── */
    .header {
      text-align: center;
      margin-bottom: 48px;
    }
    .header__logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .header__logo-mark {
      width: 36px; height: 36px;
      background: var(--steel-mid);
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
    }
    .header h1 {
      font-family: var(--font-display);
      font-size: clamp(36px, 6vw, 56px);
      color: var(--white);
      letter-spacing: 0.02em;
      line-height: 1;
      margin-bottom: 10px;
    }
    .header h1 span { color: var(--steel-light); }
    .header p {
      font-size: 15px;
      color: var(--muted);
    }

    /* ── EVENT TYPE SELECTOR ── */
    .type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 32px;
    }
    .type-btn {
      background: var(--navy-3);
      border: 1.5px solid rgba(34,120,172,0.2);
      border-radius: var(--r-md);
      padding: 20px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s, background 0.2s, transform 0.15s;
      position: relative;
      overflow: hidden;
    }
    .type-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: var(--steel-glow);
      opacity: 0;
      transition: opacity 0.2s;
    }
    .type-btn:hover::before { opacity: 1; }
    .type-btn:hover { border-color: rgba(56,153,204,0.4); transform: translateY(-1px); }
    .type-btn.active {
      border-color: var(--steel-mid);
      background: rgba(34,120,172,0.1);
    }
    .type-btn.active::before { opacity: 1; }
    .type-btn__icon {
      width: 36px; height: 36px;
      background: var(--navy-4);
      border-radius: var(--r-sm);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 12px;
      color: var(--steel-light);
    }
    .type-btn.active .type-btn__icon {
      background: var(--steel-mid);
      color: var(--white);
    }
    .type-btn__label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .type-btn.active .type-btn__label { color: var(--steel-light); }
    .type-btn__name {
      font-size: 16px;
      font-weight: 600;
      color: var(--white);
      line-height: 1.3;
    }
    .type-btn__check {
      position: absolute;
      top: 14px; right: 14px;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: var(--steel-mid);
      display: none;
      align-items: center; justify-content: center;
    }
    .type-btn.active .type-btn__check { display: flex; }

    /* ── CARD ── */
    .card {
      background: var(--navy-2);
      border: 1px solid rgba(34,120,172,0.2);
      border-radius: var(--r-lg);
      padding: 36px;
      margin-bottom: 16px;
    }
    .card__title {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 0.05em;
      color: var(--white);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card__title-num {
      width: 28px; height: 28px;
      background: var(--steel-mid);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px;
      font-family: var(--font-body);
      font-weight: 700;
      flex-shrink: 0;
    }

    /* ── FORM ── */
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-grid--full { grid-template-columns: 1fr; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field--full { grid-column: 1 / -1; }
    .field label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .field input,
    .field select,
    .field textarea {
      background: var(--navy-3);
      border: 1.5px solid rgba(34,120,172,0.2);
      border-radius: var(--r-md);
      color: var(--white);
      font-family: var(--font-body);
      font-size: 15px;
      padding: 12px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
    }
    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: var(--steel-mid);
      box-shadow: 0 0 0 3px rgba(34,120,172,0.15);
    }
    .field input::placeholder { color: var(--faint); }
    .field select option { background: var(--navy-3); }
    .field textarea { resize: vertical; min-height: 80px; }

    /* ── ZOOM SECTION ── */
    .zoom-links {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .zoom-option {
      background: var(--navy-3);
      border: 1.5px solid rgba(34,120,172,0.2);
      border-radius: var(--r-md);
      padding: 14px 16px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .zoom-option:hover { border-color: rgba(56,153,204,0.4); background: var(--steel-glow); }
    .zoom-option.active { border-color: var(--steel-mid); background: rgba(34,120,172,0.1); }
    .zoom-option__radio {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid var(--faint);
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.2s;
    }
    .zoom-option.active .zoom-option__radio {
      border-color: var(--steel-light);
    }
    .zoom-option.active .zoom-option__radio::after {
      content: '';
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--steel-light);
    }
    .zoom-option__text { font-size: 14px; font-weight: 600; color: var(--off-white); }
    .zoom-option__url { font-size: 11px; color: var(--muted); margin-top: 2px; }

    /* ── PREVIEW ── */
    .preview {
      background: var(--navy-3);
      border: 1px solid rgba(34,120,172,0.15);
      border-radius: var(--r-lg);
      padding: 28px;
      margin-bottom: 24px;
    }
    .preview__label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--steel-light);
      margin-bottom: 16px;
    }
    .preview__title {
      font-family: var(--font-display);
      font-size: 26px;
      color: var(--white);
      letter-spacing: 0.03em;
      margin-bottom: 16px;
      min-height: 32px;
    }
    .preview__details {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
    }
    .preview__detail {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: var(--muted);
    }
    .preview__detail svg { color: var(--steel-light); flex-shrink: 0; }
    .preview__detail span { color: var(--off-white); font-weight: 500; }

    /* ── BUTTONS ── */
    .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-body);
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.04em;
      border-radius: var(--r-full);
      border: none;
      cursor: pointer;
      padding: 14px 28px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--steel-mid);
      color: var(--white);
      box-shadow: 0 0 24px rgba(34,120,172,0.3);
      flex: 1;
      justify-content: center;
    }
    .btn-primary:hover {
      background: var(--steel-light);
      box-shadow: 0 0 40px rgba(56,153,204,0.45);
      transform: translateY(-2px);
    }
    .btn-success {
      background: var(--success);
      color: var(--navy);
      box-shadow: 0 0 24px rgba(61,214,140,0.25);
      flex: 1;
      justify-content: center;
    }
    .btn-success:hover {
      filter: brightness(1.08);
      box-shadow: 0 0 40px rgba(61,214,140,0.4);
      transform: translateY(-2px);
    }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      border: 1.5px solid rgba(34,120,172,0.2);
    }
    .btn-ghost:hover { border-color: var(--steel-mid); color: var(--off-white); }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: 32px; left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--success);
      color: var(--navy);
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: var(--r-full);
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 32px rgba(61,214,140,0.3);
      transition: transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.4s;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34,120,172,0.25), transparent);
      margin: 28px 0;
    }

    @media (max-width: 600px) {
      .type-selector { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .zoom-links { grid-template-columns: 1fr; }
      .card { padding: 24px 20px; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>

<div class="wrapper">

  <!-- HEADER -->
  <div class="header">
    <div class="header__logo">
      <div class="header__logo-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      </div>
    </div>
    <h1>EVENT <span>CREATOR</span></h1>
    <p>Strong Standard · Monthly Events → Google Calendar</p>
  </div>

  <!-- STEP 1: Event Type -->
  <div class="card">
    <div class="card__title">
      <div class="card__title-num">1</div>
      Choose Event Type
    </div>
    <div class="type-selector">
      <button class="type-btn active" data-type="office-hours" onclick="selectType('office-hours')">
        <div class="type-btn__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <div class="type-btn__label">Type 01</div>
        <div class="type-btn__name">Office Hours</div>
        <div class="type-btn__check">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </button>
      <button class="type-btn" data-type="educational" onclick="selectType('educational')">
        <div class="type-btn__icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </div>
        <div class="type-btn__label">Type 02</div>
        <div class="type-btn__name">Topic-Based Educational Call</div>
        <div class="type-btn__check">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
      </button>
    </div>
  </div>

  <!-- STEP 2: Event Details -->
  <div class="card">
    <div class="card__title">
      <div class="card__title-num">2</div>
      Event Details
    </div>
    <div class="form-grid">

      <!-- Office Hours fields -->
      <div class="field field--full" id="field-person">
        <label>Person in Charge</label>
        <input type="text" id="person" placeholder="e.g. Dr. Joey Munoz" oninput="updatePreview()">
      </div>

      <!-- Educational Call fields -->
      <div class="field field--full" id="field-topic" style="display:none;">
        <label>Topic</label>
        <input type="text" id="topic" placeholder="e.g. Building Sustainable Habits After 40" oninput="updatePreview()">
      </div>

      <div class="field">
        <label>Date</label>
        <input type="date" id="date" oninput="updatePreview()">
      </div>

      <div class="field">
        <label>Time (EST)</label>
        <input type="time" id="time" value="19:00" oninput="updatePreview()">
      </div>

      <div class="field field--full">
        <label>Description (optional)</label>
        <textarea id="description" placeholder="Add any extra details for the calendar event..." oninput="updatePreview()"></textarea>
      </div>

    </div>
  </div>

  <!-- STEP 3: Zoom Link -->
  <div class="card">
    <div class="card__title">
      <div class="card__title-num">3</div>
      Zoom Link
    </div>
    <div class="zoom-links" id="zoom-links">
      <!-- Populated by JS -->
    </div>
    <div class="divider"></div>
    <div class="field">
      <label>Or use a custom Zoom link</label>
      <input type="url" id="custom-zoom" placeholder="https://zoom.us/j/..." oninput="selectZoom('custom'); updatePreview()">
    </div>
  </div>

  <!-- PREVIEW -->
  <div class="preview">
    <div class="preview__label">Preview</div>
    <div class="preview__title" id="preview-title">Office Hours With —</div>
    <div class="preview__details">
      <div class="preview__detail">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span id="preview-date">—</span>
      </div>
      <div class="preview__detail">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="preview-time">—</span>
      </div>
      <div class="preview__detail">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 10l4.553-2.069A1 1 0 0121 8.87v6.26a1 1 0 01-1.447.9L15 14M3 8a2 2 0 012-2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/></svg>
        <span id="preview-zoom">—</span>
      </div>
      <div class="preview__detail">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 14 14"/></svg>
        <span>60 minutes</span>
      </div>
    </div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">
    <button class="btn btn-ghost" onclick="resetForm()">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.51"/></svg>
      Reset
    </button>
    <button class="btn btn-primary" onclick="openGoogleCalendar()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Add to Google Calendar
    </button>
    <button class="btn btn-ghost" onclick="copyLink()" id="copy-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      Copy Link
    </button>
  </div>

</div>

<div class="toast" id="toast">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
  Link copied!
</div>

<script>
  // ── ZOOM LINKS (edit these) ──────────────────────────
  const ZOOM_LINKS = [
    {
      id: 'zoom-1',
      label: 'Main Coaching Room',
      url: 'ZOOM_LINK_1_PLACEHOLDER'
    },
    {
      id: 'zoom-2',
      label: 'Educational Calls Room',
      url: 'ZOOM_LINK_2_PLACEHOLDER'
    }
  ];

  // ── STATE ────────────────────────────────────────────
  let state = {
    type: 'office-hours',
    selectedZoom: 'zoom-1'
  };

  // ── INIT ─────────────────────────────────────────────
  function init() {
    renderZoomLinks();
    updatePreview();
    // Set today as default date
    const today = new Date();
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth()+1).padStart(2,'0');
    const dd = String(today.getDate()).padStart(2,'0');
    document.getElementById('date').value = `${yyyy}-${mm}-${dd}`;
    updatePreview();
  }

  function renderZoomLinks() {
    const container = document.getElementById('zoom-links');
    container.innerHTML = ZOOM_LINKS.map(z => `
      <div class="zoom-option ${state.selectedZoom === z.id ? 'active' : ''}"
           onclick="selectZoom('${z.id}')">
        <div class="zoom-option__radio"></div>
        <div>
          <div class="zoom-option__text">${z.label}</div>
          <div class="zoom-option__url">${z.url.replace('ZOOM_LINK_','Room ').replace('_PLACEHOLDER','')}</div>
        </div>
      </div>
    `).join('');
  }

  // ── INTERACTIONS ──────────────────────────────────────
  function selectType(type) {
    state.type = type;
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-type="${type}"]`).classList.add('active');
    document.getElementById('field-person').style.display = type === 'office-hours' ? '' : 'none';
    document.getElementById('field-topic').style.display = type === 'educational' ? '' : 'none';
    updatePreview();
  }

  function selectZoom(id) {
    state.selectedZoom = id;
    document.querySelectorAll('.zoom-option').forEach(o => o.classList.remove('active'));
    if (id !== 'custom') {
      renderZoomLinks();
      document.getElementById('custom-zoom').value = '';
    }
    updatePreview();
  }

  // ── PREVIEW ───────────────────────────────────────────
  function updatePreview() {
    const person = document.getElementById('person').value.trim();
    const topic = document.getElementById('topic').value.trim();
    const date = document.getElementById('date').value;
    const time = document.getElementById('time').value;

    // Title
    let title = '';
    if (state.type === 'office-hours') {
      title = person ? `Office Hours With ${person}` : 'Office Hours With —';
    } else {
      title = topic ? `Topic-Based Educational Call | ${topic}` : 'Topic-Based Educational Call | —';
    }
    document.getElementById('preview-title').textContent = title;

    // Date
    if (date) {
      const d = new Date(date + 'T12:00:00');
      document.getElementById('preview-date').textContent = d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
    } else {
      document.getElementById('preview-date').textContent = '—';
    }

    // Time
    if (time) {
      const [h, m] = time.split(':');
      const hr = parseInt(h);
      const ampm = hr >= 12 ? 'PM' : 'AM';
      const hr12 = hr % 12 || 12;
      document.getElementById('preview-time').textContent = `${hr12}:${m} ${ampm} EST`;
    } else {
      document.getElementById('preview-time').textContent = '—';
    }

    // Zoom
    const zoomUrl = getZoomUrl();
    document.getElementById('preview-zoom').textContent = zoomUrl ? zoomUrl.replace('https://','').split('/')[0] : '—';
  }

  // ── HELPERS ───────────────────────────────────────────
  function getTitle() {
    const person = document.getElementById('person').value.trim();
    const topic = document.getElementById('topic').value.trim();
    if (state.type === 'office-hours') return `Office Hours With ${person}`;
    return `Topic-Based Educational Call | ${topic}`;
  }

  function getZoomUrl() {
    const custom = document.getElementById('custom-zoom').value.trim();
    if (custom) return custom;
    const link = ZOOM_LINKS.find(z => z.id === state.selectedZoom);
    return link ? link.url : '';
  }

  function buildGCalUrl() {
    const title = getTitle();
    const date = document.getElementById('date').value;
    const time = document.getElementById('time').value;
    const desc = document.getElementById('description').value.trim();
    const zoomUrl = getZoomUrl();

    if (!date || !time) { alert('Please fill in the date and time.'); return null; }

    // Build datetime strings for Google Cal (format: 20260521T190000)
    const startDt = date.replace(/-/g,'') + 'T' + time.replace(':','') + '00';
    // Add 1 hour for end
    const [h, m] = time.split(':').map(Number);
    const endH = String(h + 1).padStart(2,'0');
    const endDt = date.replace(/-/g,'') + 'T' + endH + String(m).padStart(2,'0') + '00';

    const details = [
      desc,
      zoomUrl ? `Zoom Link: ${zoomUrl}` : ''
    ].filter(Boolean).join('\n\n');

    const params = new URLSearchParams({
      action: 'TEMPLATE',
      text: title,
      dates: `${startDt}/${endDt}`,
      ctz: 'America/New_York',
      details: details,
      location: zoomUrl
    });

    return `https://calendar.google.com/calendar/render?${params.toString()}`;
  }

  function openGoogleCalendar() {
    const url = buildGCalUrl();
    if (url) window.open(url, '_blank');
  }

  function copyLink() {
    const url = buildGCalUrl();
    if (!url) return;
    navigator.clipboard.writeText(url).then(() => {
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2800);
    });
  }

  function resetForm() {
    document.getElementById('person').value = '';
    document.getElementById('topic').value = '';
    document.getElementById('time').value = '19:00';
    document.getElementById('description').value = '';
    document.getElementById('custom-zoom').value = '';
    state.selectedZoom = 'zoom-1';
    renderZoomLinks();
    selectType('office-hours');
    updatePreview();
  }

  init();
</script>
</body>
</html>
