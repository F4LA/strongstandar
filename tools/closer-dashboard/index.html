<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strong Standard — Closer Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #080D1A;
    --navy-mid: #0f1729;
    --navy-light: #1a2540;
    --steel-mid: #2278AC;
    --steel-light: #3899CC;
    --steel-pale: #1a3a52;
    --gold: #C9A84C;
    --gold-pale: rgba(201,168,76,0.1);
    --green: #2ECC71;
    --green-pale: rgba(46,204,113,0.1);
    --red: #E74C3C;
    --red-pale: rgba(231,76,60,0.1);
    --text: #E8EEF4;
    --text-muted: #6B85A0;
    --text-dim: #3d5570;
    --border: rgba(56,153,204,0.15);
    --border-bright: rgba(56,153,204,0.35);
    --card-bg: rgba(15,23,41,0.8);
    --font-display: 'Bebas Neue', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--navy);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 80% 10%, rgba(34,120,172,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 40% 60% at 10% 80%, rgba(34,120,172,0.05) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(56,153,204,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(56,153,204,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── SETUP SCREEN ── */
  #setup-screen {
    position: fixed; inset: 0;
    background: var(--navy);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
  }

  .setup-card {
    background: var(--navy-mid);
    border: 1px solid var(--border-bright);
    border-radius: 16px;
    padding: 48px;
    width: 480px; max-width: 90vw;
    position: relative; overflow: hidden;
  }

  .setup-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--steel-mid), var(--steel-light), transparent);
  }

  .setup-logo { font-family: var(--font-display); font-size: 28px; letter-spacing: 3px; color: var(--steel-light); margin-bottom: 8px; }
  .setup-subtitle { color: var(--text-muted); font-size: 13px; margin-bottom: 36px; letter-spacing: 0.5px; }
  .setup-label { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: block; }

  .setup-input {
    width: 100%;
    background: var(--navy); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 16px; color: var(--text); font-family: var(--font-mono); font-size: 13px;
    outline: none; margin-bottom: 20px; transition: border-color 0.2s;
  }
  .setup-input:focus { border-color: var(--steel-mid); }
  .setup-input::placeholder { color: var(--text-dim); }

  .setup-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--steel-mid), var(--steel-light));
    border: none; border-radius: 8px; padding: 14px;
    color: white; font-family: var(--font-body); font-size: 14px; font-weight: 600;
    letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
  }
  .setup-btn:hover { opacity: 0.9; transform: translateY(-1px); }
  .setup-btn:active { transform: translateY(0); }

  .setup-error {
    background: var(--red-pale); border: 1px solid rgba(231,76,60,0.3);
    border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--red);
    margin-top: 12px; display: none;
  }

  /* ── HEADER ── */
  .header {
    position: relative; z-index: 10;
    padding: 24px 40px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(8,13,26,0.9); backdrop-filter: blur(10px);
  }

  .header-left { display: flex; align-items: center; gap: 20px; }
  .logo { font-family: var(--font-display); font-size: 22px; letter-spacing: 3px; color: var(--steel-light); }
  .logo span { color: var(--text-muted); font-size: 12px; letter-spacing: 2px; font-family: var(--font-body); font-weight: 400; display: block; }
  .header-divider { width: 1px; height: 32px; background: var(--border); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  .last-updated { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }

  .refresh-btn {
    background: var(--navy-light); border: 1px solid var(--border); border-radius: 6px;
    padding: 7px 14px; color: var(--text-muted); font-size: 12px; font-family: var(--font-body);
    cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 6px;
  }
  .refresh-btn:hover { border-color: var(--steel-mid); color: var(--steel-light); }

  /* ── CONTROLS ── */
  .controls-bar {
    position: relative; z-index: 10;
    padding: 20px 40px;
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }

  .control-group { display: flex; align-items: center; gap: 10px; }
  .control-label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; }
  .select-wrapper { position: relative; }

  select {
    background: var(--navy-mid); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 36px 8px 14px; color: var(--text); font-family: var(--font-body);
    font-size: 13px; font-weight: 500; outline: none; cursor: pointer;
    appearance: none; transition: border-color 0.2s; min-width: 140px;
  }
  select:focus { border-color: var(--steel-mid); }
  .select-wrapper::after {
    content: '▾'; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    color: var(--text-muted); pointer-events: none; font-size: 12px;
  }

  .period-pills {
    display: flex; background: var(--navy-mid); border: 1px solid var(--border);
    border-radius: 8px; padding: 3px; gap: 3px;
  }
  .period-pill {
    padding: 5px 14px; border-radius: 5px; font-size: 12px; font-weight: 500;
    color: var(--text-muted); cursor: pointer; transition: all 0.15s;
    border: none; background: transparent;
  }
  .period-pill.active { background: var(--steel-mid); color: white; }

  /* ── MAIN ── */
  .main {
    position: relative; z-index: 5;
    padding: 32px 40px; max-width: 1400px; margin: 0 auto;
  }

  /* ── HERO ── */
  .closer-hero {
    margin-bottom: 28px;
    display: flex; align-items: flex-end; justify-content: space-between;
  }
  .closer-name { font-family: var(--font-display); font-size: 52px; letter-spacing: 4px; color: var(--text); line-height: 1; }
  .closer-period { font-size: 12px; color: var(--text-muted); font-family: var(--font-mono); letter-spacing: 1px; margin-top: 6px; }
  .closer-badge { display: flex; align-items: center; gap: 8px; border-radius: 24px; padding: 8px 18px; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.8); } }

  /* ── STAT CARDS ── */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }

  .stat-card {
    background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
    padding: 22px 24px; position: relative; overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
  }
  .stat-card:hover { border-color: var(--border-bright); transform: translateY(-2px); }
  .stat-card.accent { border-color: rgba(56,153,204,0.3); background: linear-gradient(135deg, var(--navy-mid), rgba(34,120,172,0.08)); }
  .stat-card.gold   { border-color: rgba(201,168,76,0.25); background: linear-gradient(135deg, var(--navy-mid), rgba(201,168,76,0.05)); }
  .stat-card.green  { border-color: rgba(46,204,113,0.2);  background: linear-gradient(135deg, var(--navy-mid), rgba(46,204,113,0.05)); }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(56,153,204,0.4), transparent);
  }
  .stat-card.gold::before  { background: linear-gradient(90deg, transparent, rgba(201,168,76,0.4), transparent); }
  .stat-card.green::before { background: linear-gradient(90deg, transparent, rgba(46,204,113,0.3), transparent); }

  .stat-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); font-weight: 600; margin-bottom: 10px; }
  .stat-value { font-family: var(--font-display); font-size: 38px; letter-spacing: 1px; color: var(--text); line-height: 1; margin-bottom: 6px; }
  .stat-value.money    { color: var(--steel-light); }
  .stat-value.gold-val { color: var(--gold); }
  .stat-value.green-val{ color: var(--green); }
  .stat-sub { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }

  /* ── LAYOUT ── */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }

  /* ── PANEL ── */
  .panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .panel-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
  .panel-title { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; }
  .panel-body { padding: 20px 24px; }

  /* ── METRIC ROWS ── */
  .metric-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid rgba(56,153,204,0.06); }
  .metric-row:last-child { border-bottom: none; }
  .metric-name { font-size: 13px; color: var(--text-muted); }
  .metric-val { font-family: var(--font-mono); font-size: 14px; font-weight: 500; color: var(--text); }
  .metric-val.accent-val { color: var(--steel-light); }
  .metric-val.gold-val   { color: var(--gold); }
  .metric-val.green-val  { color: var(--green); }
  .metric-val.red-val    { color: var(--red); }

  /* ── PROGRESS BARS ── */
  .progress-container { margin-bottom: 16px; }
  .progress-header { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .progress-label { font-size: 12px; color: var(--text-muted); }
  .progress-pct { font-size: 12px; font-family: var(--font-mono); color: var(--text); font-weight: 500; }
  .progress-bar { height: 6px; background: var(--navy-light); border-radius: 3px; overflow: hidden; }
  .progress-fill {
    height: 100%; border-radius: 3px;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
    position: relative;
  }
  .progress-fill::after {
    content: ''; position: absolute; top: 0; right: 0;
    width: 4px; height: 100%; background: rgba(255,255,255,0.5); border-radius: 2px;
  }

  /* ── CALLS TABLE ── */
  .calls-table-wrap { overflow-x: auto; max-height: 460px; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
    color: var(--text-dim); font-weight: 700; padding: 10px 16px;
    text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap;
    position: sticky; top: 0; background: var(--navy-mid); z-index: 2;
  }
  tbody tr { border-bottom: 1px solid rgba(56,153,204,0.05); transition: background 0.15s; }
  tbody tr:hover { background: rgba(56,153,204,0.04); }
  tbody tr:last-child { border-bottom: none; }
  tbody td { padding: 11px 16px; font-size: 13px; color: var(--text); white-space: nowrap; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; letter-spacing: 0.3px; }
  .badge-showed    { background: rgba(56,153,204,0.12); color: var(--steel-light); border: 1px solid rgba(56,153,204,0.25); }
  .badge-closed    { background: var(--green-pale); color: var(--green); border: 1px solid rgba(46,204,113,0.25); }
  .badge-noshow    { background: var(--red-pale); color: var(--red); border: 1px solid rgba(231,76,60,0.25); }
  .badge-cancelled { background: rgba(107,133,160,0.1); color: var(--text-muted); border: 1px solid rgba(107,133,160,0.2); }
  .badge-followup  { background: var(--gold-pale); color: var(--gold); border: 1px solid rgba(201,168,76,0.25); }
  .badge-disq      { background: rgba(150,100,200,0.1); color: #b07de0; border: 1px solid rgba(150,100,200,0.2); }

  /* ── COMMISSION ROWS ── */
  .commission-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 0; border-bottom: 1px solid rgba(56,153,204,0.06);
  }
  .commission-row:last-child { border-bottom: none; }
  .commission-row.is-refund {
    background: rgba(231,76,60,0.05); border-radius: 6px;
    padding: 10px 10px; margin: 3px -10px;
    border-bottom: none;
  }
  .commission-left { display: flex; flex-direction: column; gap: 2px; }
  .commission-name { font-size: 13px; font-weight: 500; color: var(--text); }
  .commission-name.refund-name { color: var(--red); }
  .commission-date { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
  .commission-right { text-align: right; }
  .commission-amount { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--gold); }
  .commission-amount.refund-amt { color: var(--red); }
  .commission-sub { font-size: 11px; color: var(--text-dim); font-family: var(--font-mono); }
  .commission-sub.refund-sub { color: rgba(231,76,60,0.7); }

  .refund-tag {
    font-size: 10px; color: var(--red); background: var(--red-pale);
    border-radius: 4px; padding: 2px 6px; margin-top: 2px;
    display: inline-block; letter-spacing: 0.5px;
  }

  .comm-net-row {
    display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px;
  }

  /* ── LOADING ── */
  .loading-overlay {
    position: fixed; inset: 0; background: var(--navy); z-index: 50;
    display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
  }
  .loading-text { font-family: var(--font-display); font-size: 20px; letter-spacing: 4px; color: var(--steel-light); animation: flicker 1.5s infinite; }
  @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  .loading-bar { width: 200px; height: 2px; background: var(--navy-light); border-radius: 1px; overflow: hidden; }
  .loading-progress { height: 100%; background: linear-gradient(90deg, var(--steel-mid), var(--steel-light)); animation: loadprog 1.5s infinite; }
  @keyframes loadprog { 0% { width: 0%; } 100% { width: 100%; } }

  .empty-state { padding: 40px; text-align: center; color: var(--text-dim); font-size: 13px; }
  .fade-in { animation: fadeIn 0.4s ease forwards; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--navy); }
  ::-webkit-scrollbar-thumb { background: var(--navy-light); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--steel-pale); }

  @media (max-width: 1100px) {
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
    .two-col { grid-template-columns: 1fr; }
  }
  @media (max-width: 700px) {
    .main { padding: 20px; }
    .header { padding: 16px 20px; }
    .controls-bar { padding: 16px 20px; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .closer-name { font-size: 36px; }
  }
</style>
<script src="https://link.msgsndr.com/js/external-tracking.js" data-tracking-id="tk_64a7d969aad242139fef91e0e9c35c84"></script>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen">
  <div class="setup-card">
    <div class="setup-logo">STRONG STANDARD</div>
    <div class="setup-subtitle">Closer Performance Dashboard</div>
    <label class="setup-label">Google API Key</label>
    <input type="password" class="setup-input" id="api-key-input" placeholder="AIzaSy..." />
    <label class="setup-label">Google Sheet ID</label>
    <input type="text" class="setup-input" id="sheet-id-input"
      placeholder="1t19JjlIjliu1I5AEuxmDDM9..."
      value="1t19JjlIjliu1I5AEuxmDDM9EZQnKmkSFmZuk04c2foQ" />
    <button class="setup-btn" onclick="initDashboard()">LOAD DASHBOARD</button>
    <div class="setup-error" id="setup-error"></div>
  </div>
</div>

<!-- LOADING -->
<div class="loading-overlay" id="loading-overlay" style="display:none">
  <div class="loading-text">LOADING DATA</div>
  <div class="loading-bar"><div class="loading-progress"></div></div>
</div>

<!-- APP -->
<div id="app" style="display:none">

  <div class="header">
    <div class="header-left">
      <div class="logo">STRONG STANDARD <span>CLOSER DASHBOARD</span></div>
      <div class="header-divider"></div>
      <div style="font-size:12px;color:var(--text-dim)">v3.0</div>
    </div>
    <div class="header-right">
      <div class="last-updated" id="last-updated">—</div>
      <button class="refresh-btn" onclick="refreshData()">↻ Refresh</button>
      <button class="refresh-btn" onclick="resetSetup()" style="color:var(--text-dim)">⚙ Setup</button>
    </div>
  </div>

  <div class="controls-bar">
    <div class="control-group">
      <span class="control-label">Closer</span>
      <div class="select-wrapper">
        <select id="closer-select" onchange="onCloserChange()"><option>Loading…</option></select>
      </div>
    </div>
    <div class="control-group">
      <span class="control-label">Period</span>
      <div class="period-pills">
        <button class="period-pill active" onclick="setPeriod('monthly',this)">Monthly</button>
        <button class="period-pill"        onclick="setPeriod('quarterly',this)">Quarterly</button>
        <button class="period-pill"        onclick="setPeriod('all',this)">All Time</button>
      </div>
    </div>
    <div class="control-group" id="month-control">
      <span class="control-label">Month</span>
      <div class="select-wrapper">
        <select id="month-select" onchange="onMonthChange()"><option>—</option></select>
      </div>
    </div>
  </div>

  <div class="main" id="main-content">
    <div class="empty-state">Select a closer to view the dashboard.</div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════════
// COLUMN MAPS  (0-based indices)
// ═══════════════════════════════════════════════════════════════

// IMPORT - LEADS APPLIED
const LA = {
  firstName : 0,   // A
  lastName  : 1,   // B
  callDate  : 10,  // K  Sales call booked date
  outcome   : 11,  // L  Call status: Showed / No Show / Cancelled / Disqualified on sales call / Follow Up
  closer    : 12,  // M  Sales call with
  endInSale : 13,  // N  "yes" / "no"
};

// IMPORT - MASTERSHEET
const MS = {
  firstName    : 0,   // A
  lastName     : 1,   // B
  dealValue    : 4,   // E
  saleDate     : 5,   // F
  startDate    : 6,   // G
  closer       : 12,  // M  Sales person
  type         : 18,  // S  "new"
  refundFlag   : 24,  // Y  TRUE = refunded (exclude from commission calc)
  cashCollected: 25,  // Z
  payoutDate   : 26,  // AA
  refundDate   : 30,  // AE
};

// IMPORT - GC MASTERSHEET
const GC = {
  firstName    : 0,   // A
  lastName     : 1,   // B
  dealValue    : 4,   // E
  saleDate     : 5,   // F
  closer       : 10,  // K
  cashCollected: 16,  // Q
  payoutDate   : 17,  // R
  excludeFlag  : 18,  // S  TRUE = exclude
};

// ═══════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════
let API_KEY  = '';
let SHEET_ID = '';

const raw = { la: [], ms: [], gc: [] };

let currentCloser  = '';
let currentPeriod  = 'monthly';
let currentMonth   = '';
let availableClosers = [];

// ═══════════════════════════════════════════════════════════════
// SETUP / INIT
// ═══════════════════════════════════════════════════════════════
async function initDashboard() {
  API_KEY  = document.getElementById('api-key-input').value.trim();
  SHEET_ID = document.getElementById('sheet-id-input').value.trim();
  if (!API_KEY || !SHEET_ID) return showSetupError('Please enter both API Key and Sheet ID.');

  document.getElementById('setup-screen').style.display    = 'none';
  document.getElementById('loading-overlay').style.display = 'flex';
  try {
    await loadAllData();
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    buildUI();
  } catch (e) {
    document.getElementById('loading-overlay').style.display = 'none';
    document.getElementById('setup-screen').style.display    = 'flex';
    showSetupError('Error: ' + e.message);
  }
}

function showSetupError(msg) {
  const el = document.getElementById('setup-error');
  el.style.display = 'block';
  el.textContent   = msg;
}

function resetSetup() {
  document.getElementById('app').style.display          = 'none';
  document.getElementById('setup-screen').style.display = 'flex';
}

async function refreshData() {
  document.getElementById('loading-overlay').style.display = 'flex';
  try { await loadAllData(); buildMonthOptions(); renderDashboard(); } catch (e) { console.error(e); }
  document.getElementById('loading-overlay').style.display = 'none';
}

// ═══════════════════════════════════════════════════════════════
// DATA LOADING
// ═══════════════════════════════════════════════════════════════
async function apiFetch(range) {
  const url = `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}/values/${encodeURIComponent(range)}?key=${API_KEY}`;
  const res = await fetch(url);
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${res.status} fetching "${range}"`);
  }
  return (await res.json()).values || [];
}

async function loadAllData() {
  // Get tab names
  const metaRes = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}?key=${API_KEY}&fields=sheets.properties.title`
  );
  if (!metaRes.ok) throw new Error('Cannot access spreadsheet — check API Key and Sheet ID.');
  const tabs = (await metaRes.json()).sheets.map(s => s.properties.title);

  const findTab = (...names) => {
    for (const n of names) {
      const t = tabs.find(t => t.toLowerCase() === n.toLowerCase()); if (t) return t;
    }
    for (const n of names) {
      const t = tabs.find(t => t.toLowerCase().includes(n.toLowerCase())); if (t) return t;
    }
    return null;
  };

  const laTab = findTab('IMPORT - LEADS APPLIED', 'LEADS APPLIED');
  const msTab = findTab('IMPORT - MASTERSHEET',   'MASTERSHEET');
  const gcTab = findTab('IMPORT - GC MASTERSHEET','GC MASTERSHEET');

  if (!laTab) throw new Error(`Tab "IMPORT - LEADS APPLIED" not found.\nAvailable: ${tabs.join(', ')}`);
  if (!msTab) throw new Error(`Tab "IMPORT - MASTERSHEET" not found.\nAvailable: ${tabs.join(', ')}`);

  const [laRows, msRows, gcRows] = await Promise.all([
    apiFetch(`'${laTab}'!A1:N3000`),
    apiFetch(`'${msTab}'!A1:AE3000`),
    gcTab ? apiFetch(`'${gcTab}'!A1:S3000`) : Promise.resolve([]),
  ]);

  // Row 0 = header → skip
  raw.la = laRows.slice(1).filter(r => r && r.length);
  raw.ms = msRows.slice(1).filter(r => r && r.length);
  raw.gc = gcRows.slice(1).filter(r => r && r.length);

  // Unique closer names from LEADS APPLIED col M
  const seen = new Set();
  raw.la.forEach(r => { const c = (r[LA.closer] || '').trim(); if (c) seen.add(c); });
  availableClosers = [...seen].sort();

  document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
}

// ═══════════════════════════════════════════════════════════════
// DATE / VALUE HELPERS
// ═══════════════════════════════════════════════════════════════
function parseDate(v) {
  if (!v) return null;
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function parseAmt(v) {
  if (v === null || v === undefined || v === '') return 0;
  const n = parseFloat(String(v).replace(/[$,\s]/g, ''));
  return isNaN(n) ? 0 : n;
}

function isTRUE(v) {
  if (v === true) return true;
  return ['true','1','yes'].includes(String(v || '').trim().toLowerCase());
}

function getDateRange() {
  if (currentPeriod === 'all') return { start: null, end: null };
  if (currentPeriod === 'monthly' && currentMonth) {
    const [y, m] = currentMonth.split('-').map(Number);
    return { start: new Date(y, m - 1, 1), end: new Date(y, m, 0, 23, 59, 59) };
  }
  if (currentPeriod === 'quarterly') {
    const now = new Date();
    return { start: new Date(now.getFullYear(), now.getMonth() - 2, 1), end: now };
  }
  return { start: null, end: null };
}

function inRange(d, s, e) {
  if (!d) return false;
  if (s && d < s) return false;
  if (e && d > e) return false;
  return true;
}

// ═══════════════════════════════════════════════════════════════
// UI WIRING
// ═══════════════════════════════════════════════════════════════
function buildUI() {
  const sel = document.getElementById('closer-select');
  sel.innerHTML = availableClosers.map(c => `<option value="${c}">${c}</option>`).join('');
  currentCloser = availableClosers[0] || '';
  buildMonthOptions();
  renderDashboard();
}

function buildMonthOptions() {
  const cLow = currentCloser.toLowerCase();
  const map  = new Map();

  raw.la.forEach(r => {
    if (!(r[LA.closer] || '').toLowerCase().includes(cLow)) return;
    const d = parseDate(r[LA.callDate]);
    if (!d) return;
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if (!map.has(key)) map.set(key, d.toLocaleDateString('en-US', { month:'long', year:'numeric' }));
  });

  const months = [...map.entries()].sort((a, b) => b[0].localeCompare(a[0]));
  const sel = document.getElementById('month-select');
  sel.innerHTML = months.map(([v,l]) => `<option value="${v}">${l}</option>`).join('');

  if (!currentMonth || !map.has(currentMonth)) currentMonth = months[0]?.[0] || '';
  sel.value = currentMonth;
}

function onCloserChange() {
  currentCloser = document.getElementById('closer-select').value;
  buildMonthOptions();
  renderDashboard();
}

function onMonthChange() {
  currentMonth = document.getElementById('month-select').value;
  renderDashboard();
}

function setPeriod(p, btn) {
  currentPeriod = p;
  document.querySelectorAll('.period-pill').forEach(x => x.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('month-control').style.display = p === 'monthly' ? 'flex' : 'none';
  renderDashboard();
}

// ═══════════════════════════════════════════════════════════════
// COMPUTATION
// ═══════════════════════════════════════════════════════════════
function computeStats() {
  const { start, end } = getDateRange();
  const cLow = currentCloser.toLowerCase();

  // ── LEADS APPLIED: filter by call date (K) + closer contains ─
  const laRows = raw.la.filter(r => {
    const d = parseDate(r[LA.callDate]);
    return (r[LA.closer]||'').toLowerCase().includes(cLow) && inRange(d, start, end);
  });

  const showedRe   = /^(showed|follow\s*up|disqualified on sales call)$/i;
  const pureShowRe = /^showed$/i;
  const followRe   = /^follow\s*up$/i;
  const disqRe     = /^disqualified on sales call$/i;
  const noShowRe   = /^no show$/i;
  const cancelRe   = /^cancelled$/i;

  const totalScheduled = laRows.length;
  const showed       = laRows.filter(r => showedRe.test((r[LA.outcome]||'').trim())).length;
  const cancelled    = laRows.filter(r => cancelRe.test((r[LA.outcome]||'').trim())).length;
  const noShow       = laRows.filter(r => noShowRe.test((r[LA.outcome]||'').trim())).length;
  const disqualified = laRows.filter(r => disqRe.test((r[LA.outcome]||'').trim())).length;
  const followUp     = laRows.filter(r => followRe.test((r[LA.outcome]||'').trim())).length;
  const closed       = laRows.filter(r => /^yes$/i.test((r[LA.endInSale]||'').trim())).length;

  // Showed — No Sale = outcome "Showed" AND did NOT close
  const showedNoSale = laRows.filter(r =>
    pureShowRe.test((r[LA.outcome]||'').trim()) &&
    !/^yes$/i.test((r[LA.endInSale]||'').trim())
  ).length;

  const grossShowRate = totalScheduled > 0 ? showed / totalScheduled : 0;
  const netShowRate   = (totalScheduled - cancelled) > 0 ? showed / (totalScheduled - cancelled) : 0;
  const closeRate     = (showed - disqualified) > 0 ? closed / (showed - disqualified) : 0;
  const disqRate      = showed > 0 ? disqualified / showed : 0;

  // ── MASTERSHEET: paid-out commission rows (Y ≠ TRUE, payout date in range) ─
  const msComm = raw.ms.filter(r => {
    const pd = parseDate(r[MS.payoutDate]);
    return (r[MS.closer]||'').toLowerCase().includes(cLow)
      && !isTRUE(r[MS.refundFlag])
      && inRange(pd, start, end);
  });

  // ── GC MASTERSHEET: commission rows (S ≠ TRUE, payout date in range) ─────
  const gcComm = raw.gc.filter(r => {
    const pd = parseDate(r[GC.payoutDate]);
    return (r[GC.closer]||'').toLowerCase().includes(cLow)
      && !isTRUE(r[GC.excludeFlag])
      && inRange(pd, start, end);
  });

  // ── MASTERSHEET: refund rows (Y = TRUE, refund date in range, exact closer) ─
  const msRef = raw.ms.filter(r => {
    const rd = parseDate(r[MS.refundDate]);
    return (r[MS.closer]||'').toLowerCase() === cLow
      && isTRUE(r[MS.refundFlag])
      && inRange(rd, start, end);
  });

  // Totals
  const totalCash = msComm.reduce((s,r) => s + parseAmt(r[MS.cashCollected]), 0)
                  + gcComm.reduce((s,r) => s + parseAmt(r[GC.cashCollected]), 0);
  const totalDeal = msComm.reduce((s,r) => s + parseAmt(r[MS.dealValue]), 0)
                  + gcComm.reduce((s,r) => s + parseAmt(r[GC.dealValue]), 0);
  const totalRefundCash = msRef.reduce((s,r) => s + parseAmt(r[MS.cashCollected]), 0);
  const commission = totalCash * 0.10;
  const commCount  = msComm.length + gcComm.length;
  const avgCC      = commCount > 0 ? totalCash / commCount : 0;
  const avgDeal    = commCount > 0 ? totalDeal / commCount : 0;

  // Commission breakdown items (sorted by payout date asc)
  const commItems = [
    ...msComm.map(r => ({
      name:         `${r[MS.firstName]||''} ${r[MS.lastName]||''}`.trim(),
      payoutDate:   parseDate(r[MS.payoutDate]),
      cashCollected:parseAmt(r[MS.cashCollected]),
      dealValue:    parseAmt(r[MS.dealValue]),
      isRefund:     false,
    })),
    ...gcComm.map(r => ({
      name:         `${r[GC.firstName]||''} ${r[GC.lastName]||''}`.trim(),
      payoutDate:   parseDate(r[GC.payoutDate]),
      cashCollected:parseAmt(r[GC.cashCollected]),
      dealValue:    parseAmt(r[GC.dealValue]),
      isRefund:     false,
    })),
    ...msRef.map(r => ({
      name:         `${r[MS.firstName]||''} ${r[MS.lastName]||''}`.trim(),
      payoutDate:   parseDate(r[MS.refundDate]),
      cashCollected:parseAmt(r[MS.cashCollected]),
      dealValue:    0,
      isRefund:     true,
    })),
  ].sort((a,b) => (a.payoutDate?.getTime()||0) - (b.payoutDate?.getTime()||0));

  return {
    totalScheduled, showed, showedNoSale,
    cancelled, noShow, disqualified, followUp, closed,
    grossShowRate, netShowRate, closeRate, disqRate,
    totalCash, totalDeal, totalRefundCash, commission,
    avgCC, avgDeal,
    commItems, laRows,
  };
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
function renderDashboard() {
  const el = document.getElementById('main-content');
  if (!currentCloser) { el.innerHTML = '<div class="empty-state">Select a closer to view the dashboard.</div>'; return; }

  const stats = computeStats();
  el.innerHTML = '';
  el.classList.remove('fade-in'); void el.offsetWidth; el.classList.add('fade-in');

  el.appendChild(renderHero(stats));
  el.appendChild(renderStatsGrid(stats));
  el.appendChild(renderMiddleRow(stats));
  el.appendChild(renderBottomRow(stats));
}

// ── Hero ──
function renderHero(stats) {
  const div = document.createElement('div');
  div.className = 'closer-hero';

  const periodLabel = currentPeriod === 'monthly'
    ? (document.querySelector('#month-select option:checked')?.textContent || '')
    : currentPeriod === 'quarterly' ? 'Last 3 Months' : 'All Time';

  const [label, color] = stats.closeRate >= 0.40
    ? ['Strong Performance', 'var(--green)']
    : stats.closeRate >= 0.25
    ? ['On Track', 'var(--gold)']
    : ['Needs Attention', 'var(--red)'];

  div.innerHTML = `
    <div>
      <div class="closer-name">${currentCloser.toUpperCase()}</div>
      <div class="closer-period">${periodLabel} &nbsp;·&nbsp; ${stats.closed} closure${stats.closed !== 1 ? 's' : ''}</div>
    </div>
    <div class="closer-badge" style="background:rgba(0,0,0,0.25);border:1px solid ${color};color:${color}">
      <span class="dot" style="background:${color}"></span>${label}
    </div>
  `;
  return div;
}

// ── KPI Grid ──
function renderStatsGrid(stats) {
  const g = document.createElement('div');
  g.className = 'stats-grid';
  const refCount = stats.commItems.filter(c => c.isRefund).length;
  g.innerHTML = `
    <div class="stat-card accent">
      <div class="stat-label">Close Rate</div>
      <div class="stat-value">${pct(stats.closeRate)}</div>
      <div class="stat-sub">${stats.closed} of ${stats.showed - stats.disqualified} qualified shows</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Gross Show Rate</div>
      <div class="stat-value">${pct(stats.grossShowRate)}</div>
      <div class="stat-sub">Net: ${pct(stats.netShowRate)}</div>
    </div>
    <div class="stat-card gold">
      <div class="stat-label">Commission Earned</div>
      <div class="stat-value gold-val">${money(stats.commission)}</div>
      <div class="stat-sub">10% of ${money(stats.totalCash)} collected</div>
    </div>
    <div class="stat-card green">
      <div class="stat-label">Cash Collected</div>
      <div class="stat-value green-val">${money(stats.totalCash)}</div>
      <div class="stat-sub">Deal value: ${money(stats.totalDeal)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Calls Scheduled</div>
      <div class="stat-value">${stats.totalScheduled}</div>
      <div class="stat-sub">${stats.showed} showed · ${stats.cancelled} cancelled · ${stats.noShow} no-show</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Avg CC per Close</div>
      <div class="stat-value money">${money(stats.avgCC)}</div>
      <div class="stat-sub">Avg deal: ${money(stats.avgDeal)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Refunds</div>
      <div class="stat-value" style="color:${stats.totalRefundCash > 0 ? 'var(--red)' : 'var(--text-dim)'}">${money(stats.totalRefundCash)}</div>
      <div class="stat-sub">${refCount} refund${refCount !== 1 ? 's' : ''} this period</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Follow Ups</div>
      <div class="stat-value">${stats.followUp}</div>
      <div class="stat-sub">Pending conversion</div>
    </div>
  `;
  return g;
}

// ── Middle: Funnel + Outcomes ──
function renderMiddleRow(stats) {
  const div = document.createElement('div');
  div.className = 'two-col';

  const funnel = document.createElement('div');
  funnel.className = 'panel';
  funnel.innerHTML = `
    <div class="panel-header"><span class="panel-title">Call Funnel</span></div>
    <div class="panel-body">
      ${progBar('Gross Show Rate',       stats.grossShowRate,'linear-gradient(90deg,var(--steel-mid),var(--steel-light))')}
      ${progBar('Net Show Rate',         stats.netShowRate,  'linear-gradient(90deg,var(--steel-mid),var(--steel-light))')}
      ${progBar('Close Rate',            stats.closeRate,    'linear-gradient(90deg,#9a7a30,var(--gold))')}
      ${progBar('Disqualification Rate', stats.disqRate,     'linear-gradient(90deg,#7a1a1a,var(--red))')}
    </div>
  `;

  const outcomes = document.createElement('div');
  outcomes.className = 'panel';
  outcomes.innerHTML = `
    <div class="panel-header"><span class="panel-title">Outcomes Breakdown</span></div>
    <div class="panel-body">
      ${mRow('Closed (Won)',         stats.closed,       'green-val')}
      ${mRow('Showed — No Sale',     stats.showedNoSale, 'accent-val')}
      ${mRow('Follow Ups',           stats.followUp,     'gold-val')}
      ${mRow('No Shows',             stats.noShow,       'red-val')}
      ${mRow('Cancelled',            stats.cancelled,    '')}
      ${mRow('Disqualified on Call', stats.disqualified, '')}
    </div>
  `;

  div.appendChild(funnel);
  div.appendChild(outcomes);
  return div;
}

function progBar(label, val, grad) {
  const w = Math.min((val||0)*100,100).toFixed(1);
  return `
    <div class="progress-container">
      <div class="progress-header">
        <span class="progress-label">${label}</span>
        <span class="progress-pct">${pct(val)}</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${w}%;background:${grad}"></div>
      </div>
    </div>`;
}

function mRow(label, val, cls) {
  return `<div class="metric-row"><span class="metric-name">${label}</span><span class="metric-val ${cls}">${val}</span></div>`;
}

// ── Bottom: Calls + Commissions ──
function renderBottomRow(stats) {
  const div = document.createElement('div');
  div.className = 'two-col';
  div.appendChild(renderCallsTable(stats.laRows));
  div.appendChild(renderCommissionPanel(stats));
  return div;
}

function renderCallsTable(rows) {
  const panel = document.createElement('div');
  panel.className = 'panel';

  // Sort: closed first, then by call date desc
  const sorted = [...rows].sort((a,b) => {
    const ac = /^yes$/i.test((a[LA.endInSale]||'').trim()) ? 1 : 0;
    const bc = /^yes$/i.test((b[LA.endInSale]||'').trim()) ? 1 : 0;
    if (bc !== ac) return bc - ac;
    return (parseDate(b[LA.callDate])?.getTime()||0) - (parseDate(a[LA.callDate])?.getTime()||0);
  });

  const tbody = sorted.map(r => {
    const name    = `${r[LA.firstName]||''} ${r[LA.lastName]||''}`.trim() || '—';
    const cd      = parseDate(r[LA.callDate]);
    const outcome = (r[LA.outcome]||'').trim();
    const closed  = /^yes$/i.test((r[LA.endInSale]||'').trim());
    return `<tr>
      <td style="font-weight:500">${name}</td>
      <td style="color:var(--text-dim);font-family:var(--font-mono)">${cd ? fmtDate(cd) : '—'}</td>
      <td>${badge(outcome, closed)}</td>
    </tr>`;
  }).join('');

  panel.innerHTML = `
    <div class="panel-header">
      <span class="panel-title">Calls This Period</span>
      <span style="font-size:12px;color:var(--text-dim);font-family:var(--font-mono)">${rows.length} total</span>
    </div>
    <div class="calls-table-wrap">
      <table>
        <thead><tr><th>Client</th><th>Call Date</th><th>Outcome</th></tr></thead>
        <tbody>${tbody || '<tr><td colspan="3" style="text-align:center;color:var(--text-dim);padding:24px">No calls this period</td></tr>'}</tbody>
      </table>
    </div>`;
  return panel;
}

function renderCommissionPanel(stats) {
  const panel = document.createElement('div');
  panel.className = 'panel';

  const hasRef = stats.commItems.some(c => c.isRefund);

  const rows = stats.commItems.map(item => {
    const commAmt = item.cashCollected * 0.10;
    if (item.isRefund) {
      return `
        <div class="commission-row is-refund">
          <div class="commission-left">
            <div class="commission-name refund-name">${item.name || '—'}</div>
            <div class="commission-date">Refund: ${item.payoutDate ? fmtDate(item.payoutDate) : '—'}</div>
            <span class="refund-tag">↩ REFUND</span>
          </div>
          <div class="commission-right">
            <div class="commission-amount refund-amt">-${money(item.cashCollected)}</div>
            <div class="commission-sub refund-sub">${money(commAmt)} commission</div>
          </div>
        </div>`;
    }
    return `
      <div class="commission-row">
        <div class="commission-left">
          <div class="commission-name">${item.name || '—'}</div>
          <div class="commission-date">Payout: ${item.payoutDate ? fmtDate(item.payoutDate) : '—'}</div>
        </div>
        <div class="commission-right">
          <div class="commission-amount">${money(commAmt)}</div>
          <div class="commission-sub">CC: ${money(item.cashCollected)} · Deal: ${money(item.dealValue)}</div>
        </div>
      </div>`;
  }).join('');

  const netRow = stats.commItems.length > 0 ? `
    <div class="comm-net-row">
      <span style="font-size:11px;color:var(--text-muted);letter-spacing:1px;text-transform:uppercase">
        ${hasRef ? 'Commission (excl. refunds)' : 'Total Commission'}
      </span>
      <span style="font-family:var(--font-mono);font-size:16px;font-weight:500;color:var(--gold)">${money(stats.commission)}</span>
    </div>` : '';

  panel.innerHTML = `
    <div class="panel-header">
      <span class="panel-title">Commission Breakdown</span>
      <span style="font-size:13px;font-family:var(--font-mono);color:var(--gold)">${money(stats.commission)}</span>
    </div>
    <div class="panel-body">
      ${stats.commItems.length === 0
        ? '<div class="empty-state" style="padding:16px 0">No commissions this period</div>'
        : rows + netRow}
    </div>`;
  return panel;
}

// ═══════════════════════════════════════════════════════════════
// FORMAT HELPERS
// ═══════════════════════════════════════════════════════════════
function pct(v) {
  if (!v || isNaN(v)) return '0%';
  return (v * 100).toFixed(1) + '%';
}

function money(v) {
  if (!v || isNaN(v)) return '$0';
  const fmt = '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits:0, maximumFractionDigits:0 });
  return v < 0 ? '-' + fmt : fmt;
}

function fmtDate(d) {
  if (!d) return '—';
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

function badge(outcome, isClosed) {
  if (isClosed) return '<span class="badge badge-closed">Closed</span>';
  const o = (outcome||'').toLowerCase().trim();
  if (o === 'showed')          return '<span class="badge badge-showed">Showed</span>';
  if (/follow\s*up/.test(o))   return '<span class="badge badge-followup">Follow Up</span>';
  if (o === 'no show')         return '<span class="badge badge-noshow">No Show</span>';
  if (o === 'cancelled')       return '<span class="badge badge-cancelled">Cancelled</span>';
  if (o.includes('disqualif')) return '<span class="badge badge-disq">Disqualified</span>';
  return `<span class="badge badge-cancelled">${outcome || '—'}</span>`;
}

// Enter key on setup
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('setup-screen').style.display !== 'none') initDashboard();
});
