<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Strong Standard — Payroll Portal</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── THEMES ─────────────────────────────────────────────────── */
:root {
  --navy:#080D1A; --navy-mid:#0f1729; --navy-light:#1a2540;
  --steel-mid:#2278AC; --steel-light:#3899CC; --steel-pale:#1a3a52;
  --gold:#C9A84C; --gold-pale:rgba(201,168,76,0.1);
  --green:#2ECC71; --green-pale:rgba(46,204,113,0.1);
  --red:#E74C3C; --red-pale:rgba(231,76,60,0.1);
  --purple:#9B59B6; --purple-pale:rgba(155,89,182,0.1);
  --text:#E8EEF4; --text-muted:#6B85A0; --text-dim:#3d5570;
  --border:rgba(56,153,204,0.15); --border-bright:rgba(56,153,204,0.35);
  --card-bg:rgba(15,23,41,0.8); --header-bg:rgba(8,13,26,0.95);
  --font-display:'Bebas Neue',sans-serif;
  --font-body:'DM Sans',sans-serif;
  --font-mono:'DM Mono',monospace;
}
[data-theme="light"] {
  --navy:#F0F4FA; --navy-mid:#FFFFFF; --navy-light:#DDE4EF;
  --steel-mid:#1a68a0; --steel-light:#2278AC; --steel-pale:#b8d4e8;
  --gold:#a07820; --gold-pale:rgba(160,120,32,0.08);
  --green:#1a9e55; --green-pale:rgba(26,158,85,0.08);
  --red:#c0392b; --red-pale:rgba(192,57,43,0.08);
  --purple:#7d3c98; --purple-pale:rgba(125,60,152,0.08);
  --text:#0D1B2A; --text-muted:#3d5a7a; --text-dim:#7a9ab8;
  --border:rgba(34,120,172,0.18); --border-bright:rgba(34,120,172,0.40);
  --card-bg:rgba(255,255,255,0.95); --header-bg:rgba(240,244,250,0.97);
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--navy);color:var(--text);font-family:var(--font-body);min-height:100vh;}

/* ── PASSWORD ───────────────────────────────────────────────── */
#pw-screen{position:fixed;inset:0;z-index:200;background:var(--navy);display:flex;align-items:center;justify-content:center;}
.pw-card{background:var(--navy-mid);border:1px solid var(--border-bright);border-radius:16px;padding:48px;width:400px;max-width:90vw;position:relative;overflow:hidden;text-align:center;}
.pw-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--steel-mid),var(--steel-light),transparent);}
.pw-lock{font-size:36px;margin-bottom:16px;opacity:.6;}
.pw-logo{font-family:var(--font-display);font-size:28px;letter-spacing:4px;color:var(--steel-light);margin-bottom:4px;}
.pw-sub{color:var(--text-dim);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:32px;}
.pw-input{width:100%;background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:13px 16px;color:var(--text);font-family:var(--font-mono);font-size:15px;outline:none;margin-bottom:12px;text-align:center;letter-spacing:3px;transition:border-color .2s;}
.pw-input:focus{border-color:var(--steel-mid);}
.pw-input::placeholder{letter-spacing:1px;color:var(--text-dim);font-size:13px;}
.pw-btn{width:100%;background:linear-gradient(135deg,var(--steel-mid),var(--steel-light));border:none;border-radius:8px;padding:13px;color:white;font-family:var(--font-body);font-size:13px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:opacity .2s;}
.pw-btn:hover{opacity:.9;}
.pw-error{background:var(--red-pale);border:1px solid rgba(231,76,60,.3);border-radius:8px;padding:9px 14px;font-size:12px;color:var(--red);margin-top:12px;display:none;}
.pw-shake{animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

/* ── LOADING ────────────────────────────────────────────────── */
.loading-overlay{position:fixed;inset:0;background:var(--navy);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.loading-text{font-family:var(--font-display);font-size:20px;letter-spacing:4px;color:var(--steel-light);animation:flicker 1.5s infinite;}
@keyframes flicker{0%,100%{opacity:1}50%{opacity:.4}}
.loading-bar{width:200px;height:2px;background:var(--navy-light);border-radius:1px;overflow:hidden;}
.loading-progress{height:100%;background:linear-gradient(90deg,var(--steel-mid),var(--steel-light));animation:loadprog 1.5s infinite;}
@keyframes loadprog{0%{width:0%}100%{width:100%}}

/* ── HEADER ─────────────────────────────────────────────────── */
.header{position:sticky;top:0;z-index:50;padding:16px 40px;min-height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:var(--header-bg);backdrop-filter:blur(10px);}
.logo{font-family:var(--font-display);font-size:22px;letter-spacing:3px;color:var(--steel-light);}
.logo span{color:var(--text-muted);font-size:11px;letter-spacing:2px;font-family:var(--font-body);font-weight:400;display:block;}
.header-right{display:flex;align-items:center;gap:10px;}
.hbtn{background:var(--navy-light);border:1px solid var(--border);border-radius:6px;padding:7px 14px;color:var(--text-muted);font-size:12px;font-family:var(--font-body);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
.hbtn:hover{border-color:var(--steel-mid);color:var(--steel-light);}
.theme-toggle{border-radius:20px;}

/* ── TABS ───────────────────────────────────────────────────── */
.tabs-bar{position:sticky;top:68px;z-index:49;display:flex;align-items:stretch;border-bottom:1px solid var(--border);background:var(--header-bg);backdrop-filter:blur(10px);}
.tab-btn{padding:0 32px;height:48px;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;transition:all .2s;white-space:nowrap;}
.tab-btn:hover{color:var(--text);}
.tab-btn.active{color:var(--steel-light);border-bottom-color:var(--steel-light);}
.tab-icon{font-size:15px;}

/* ── CONTROLS ───────────────────────────────────────────────── */
.controls-bar{padding:14px 40px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--header-bg);}
.control-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);font-weight:600;}
.select-wrapper{position:relative;}
.select-wrapper::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;font-size:12px;}
select{background:var(--navy-mid);border:1px solid var(--border);border-radius:8px;padding:8px 36px 8px 14px;color:var(--text);font-family:var(--font-body);font-size:13px;font-weight:500;outline:none;cursor:pointer;appearance:none;transition:border-color .2s;min-width:140px;}
select:focus{border-color:var(--steel-mid);}
.date-input{background:var(--navy-mid);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--text);font-family:var(--font-mono);font-size:12px;outline:none;transition:border-color .2s;}
.date-input:focus{border-color:var(--steel-mid);}
[data-theme="light"] .date-input{color-scheme:light;}
[data-theme="dark"]  .date-input{color-scheme:dark;}
.period-badge{display:flex;align-items:center;gap:6px;padding:6px 14px;background:var(--navy-light);border:1px solid var(--border);border-radius:8px;}
.period-badge .pb-label{font-size:11px;color:var(--text-dim);}
.period-badge .pb-val{font-family:var(--font-display);font-size:12px;color:var(--steel-light);}

/* ── MAIN ───────────────────────────────────────────────────── */
.main{padding:28px 40px;max-width:1000px;margin:0 auto;}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

/* ── CONFIG ROW ─────────────────────────────────────────────── */
.config-row{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px 24px;margin-bottom:24px;display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;}
.config-field{display:flex;flex-direction:column;gap:6px;}
.config-field label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);font-weight:600;}
.config-input{background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:9px 14px;color:var(--text);font-family:var(--font-mono);font-size:13px;outline:none;transition:border-color .2s;width:180px;}
.config-input:focus{border-color:var(--steel-mid);}
.config-input:disabled{opacity:.4;cursor:not-allowed;}

/* ── ALERT BANNER ───────────────────────────────────────────── */
.alert-banner{background:var(--red-pale);border:1px solid rgba(231,76,60,0.35);border-radius:12px;padding:16px 20px;margin-bottom:20px;}
.alert-banner-header{font-size:13px;font-weight:600;color:var(--red);margin-bottom:12px;display:flex;align-items:flex-start;gap:6px;line-height:1.4;}
.alert-banner .data-table{background:var(--navy);border-radius:8px;overflow:hidden;}
.alert-banner .data-table th{background:rgba(231,76,60,0.1)!important;color:var(--red)!important;}

/* ── CUSTOM ITEMS PANEL ─────────────────────────────────────── */
.custom-panel{background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:16px 24px;margin-bottom:24px;}
.custom-panel-header{margin-bottom:12px;}
.custom-panel-title{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-muted);font-weight:600;}
.custom-panel-sub{display:block;text-transform:none;letter-spacing:0;font-size:11px;color:var(--text-dim);font-weight:400;margin-top:3px;}
.custom-panel-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px;}
.custom-item-row{display:flex;align-items:center;gap:12px;background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:8px 14px;}
.custom-item-concept{flex:1;font-size:13px;color:var(--text);}
.custom-item-amount{font-family:var(--font-display);font-size:14px;color:var(--gold);letter-spacing:.5px;white-space:nowrap;}
.custom-item-remove{background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;transition:all .15s;line-height:1;}
.custom-item-remove:hover{color:var(--red);background:var(--red-pale);}
.custom-empty{font-size:12px;color:var(--text-dim);padding:6px 2px;}
.custom-panel-add{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}

/* ── SETTINGS MODAL ─────────────────────────────────────────── */
.settings-overlay{position:fixed;inset:0;z-index:150;background:rgba(4,8,18,0.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px;}
.settings-overlay.open{display:flex;}
.settings-modal{background:var(--navy-mid);border:1px solid var(--border-bright);border-radius:16px;width:500px;max-width:90vw;position:relative;overflow:hidden;}
.settings-modal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--steel-mid),var(--steel-light),transparent);}
.settings-modal-header{padding:18px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.settings-modal-title{font-size:13px;font-weight:600;color:var(--text);}
.settings-modal-close{background:var(--navy-light);border:1px solid var(--border);border-radius:6px;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--text-muted);cursor:pointer;transition:all .2s;}
.settings-modal-close:hover{border-color:var(--red);color:var(--red);}
.settings-modal-body{padding:24px;}
.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
.setting-item{display:flex;flex-direction:column;gap:6px;}
.setting-label{font-size:11px;color:var(--text-muted);font-weight:600;letter-spacing:.5px;}
.setting-input{background:var(--navy);border:1px solid var(--border);border-radius:8px;padding:9px 12px;color:var(--text);font-family:var(--font-mono);font-size:13px;outline:none;transition:border-color .2s;}
.setting-input:focus{border-color:var(--steel-mid);}
.settings-modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}
.btn-save{background:linear-gradient(135deg,var(--steel-mid),var(--steel-light));border:none;border-radius:8px;padding:9px 20px;color:white;font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s;}
.btn-save:hover{opacity:.9;}
.btn-cancel{background:var(--navy-light);border:1px solid var(--border);border-radius:8px;padding:9px 16px;color:var(--text-muted);font-family:var(--font-body);font-size:13px;cursor:pointer;transition:all .2s;}
.btn-cancel:hover{border-color:var(--border-bright);color:var(--text);}

/* ── SLIP ───────────────────────────────────────────────────── */
.slip{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;overflow:hidden;position:relative;}
.slip::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,var(--steel-mid),var(--steel-light),transparent);}
.slip-header{padding:24px 32px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start;}
.slip-brand{font-family:var(--font-display);font-size:24px;letter-spacing:3px;color:var(--steel-light);}
.slip-brand span{display:block;font-family:var(--font-body);font-size:10px;letter-spacing:2px;color:var(--text-muted);font-weight:400;text-transform:uppercase;margin-top:2px;}
.slip-name{font-family:var(--font-display);font-size:28px;letter-spacing:2px;color:var(--text);}
.slip-period{font-size:14px;color:var(--text-muted);font-family:var(--font-display);letter-spacing:1.5px;margin-top:4px;}
.slip-dates{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border);}
.slip-date-cell{padding:14px 24px;border-right:1px solid var(--border);}
.slip-date-cell:last-child{border-right:none;}
.slip-date-label{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);font-weight:600;margin-bottom:4px;}
.slip-date-val{font-family:var(--font-display);font-size:16px;letter-spacing:1px;color:var(--text);}
.slip-summary{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--border);}
.slip-left{padding:22px 28px;border-right:1px solid var(--border);}
.slip-right{padding:22px 28px;}
.section-title{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);font-weight:700;margin-bottom:14px;}
.sum-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(56,153,204,0.06);}
.sum-row:last-child{border-bottom:none;}
.sum-row.total{border-top:2px solid var(--border);margin-top:8px;padding-top:14px;border-bottom:none;}
.sum-label{font-size:13px;color:var(--text-muted);}
.sum-val{font-family:var(--font-display);font-size:18px;letter-spacing:1px;color:var(--text);}
.sum-val.green{color:var(--green);}
.sum-val.gold{color:var(--gold);}
.sum-val.purple{color:var(--purple);}
.sum-val.blue{color:var(--steel-light);}
.sum-val.big{font-family:var(--font-display);font-size:30px;letter-spacing:1px;color:var(--gold);}

/* ── SORT BAR ───────────────────────────────────────────────── */
.sort-bar{display:flex;align-items:center;gap:10px;padding:10px 24px;border-bottom:1px solid var(--border);}
.sort-label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);font-weight:600;}
.sort-btn{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-muted);transition:all .15s;}
.sort-btn.active{background:var(--steel-mid);color:white;border-color:transparent;}

/* ── TABLE SECTIONS ─────────────────────────────────────────── */
.slip-section{border-bottom:1px solid var(--border);}
.slip-section:last-of-type{border-bottom:none;}
.retention-section,.nonq-section{border-top:3px solid var(--border);}
.section-header-bar{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 22px;
}
.section-header-bar .sh-title{
  font-family:var(--font-display);
  font-size:20px;
  letter-spacing:2px;
  font-weight:400;
}
.section-header-bar .count-badge{
  font-family:var(--font-display);
  font-size:20px;
  letter-spacing:2px;
  opacity:.85;
}
.active-bar{background:rgba(34,120,172,0.14);color:var(--steel-light);border-bottom:1px solid rgba(56,153,204,0.2);}
.retention-bar{background:rgba(155,89,182,0.14);color:var(--purple);border-bottom:1px solid rgba(155,89,182,0.2);}
.nonq-bar{background:rgba(231,76,60,0.1);color:var(--red);border-bottom:1px solid rgba(231,76,60,0.15);}
.closer-bar{background:rgba(201,168,76,0.1);color:var(--gold);border-bottom:1px solid rgba(201,168,76,0.2);}
.data-table{width:100%;border-collapse:collapse;}
.data-table th{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;padding:9px 18px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
.active-section    .data-table th{background:rgba(34,120,172,0.08);color:var(--steel-light);}
.retention-section .data-table th{background:rgba(155,89,182,0.08);color:var(--purple);}
.nonq-section      .data-table th{background:rgba(231,76,60,0.06);color:var(--red);}
.closer-section    .data-table th{background:rgba(201,168,76,0.07);color:var(--gold);}
.data-table td{padding:10px 18px;font-size:13px;color:var(--text);border-bottom:1px solid rgba(56,153,204,0.05);white-space:nowrap;}
.data-table tbody tr:last-child td{border-bottom:none;}
.data-table tbody tr:hover{background:rgba(56,153,204,0.03);}
.empty-section{padding:18px 24px;color:var(--text-dim);font-size:12px;}
.tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600;letter-spacing:.3px;}
.tag-resign{background:var(--purple-pale);color:var(--purple);border:1px solid rgba(155,89,182,.25);}
.tag-nonq  {background:var(--red-pale);color:var(--red);border:1px solid rgba(231,76,60,.25);}
.tag-closed{background:var(--green-pale);color:var(--green);border:1px solid rgba(46,204,113,.25);}

/* ── TIER TABLE ─────────────────────────────────────────────── */
.tier-table{width:100%;border-collapse:collapse;}
.tier-table th{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--text-dim);font-weight:700;padding:8px 16px;text-align:left;border-bottom:1px solid var(--border);}
.tier-table th:not(:first-child){text-align:right;}
.tier-table td{padding:11px 16px;font-size:15px;font-family:var(--font-display);letter-spacing:.5px;border-bottom:1px solid rgba(56,153,204,0.05);}
.tier-table td:not(:first-child){text-align:right;}
.tier-table tbody tr:last-child td{border-bottom:none;}
.tier-table tfoot td{padding:11px 16px;font-size:16px;font-weight:400;border-top:2px solid var(--border);font-family:var(--font-display);letter-spacing:.5px;}
.tier-table tfoot td:not(:first-child){text-align:right;}
.tier-label{font-size:12px;color:var(--text-muted);font-family:var(--font-body);}

/* ── FOOTER ─────────────────────────────────────────────────── */
.slip-footer{padding:20px 28px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;}
.status-wrap{display:flex;align-items:center;gap:10px;}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--text-dim);}
.status-dot.approved{background:var(--green);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.8)}}
.status-text{font-size:14px;color:var(--text-muted);font-family:var(--font-display);letter-spacing:1px;}
.footer-btns{display:flex;gap:12px;}
.btn-pdf{background:var(--navy-light);border:1px solid var(--border);border-radius:8px;padding:10px 20px;color:var(--text-muted);font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:8px;}
.btn-pdf:hover{border-color:var(--steel-mid);color:var(--steel-light);}
.btn-approve{background:linear-gradient(135deg,#1a9e55,#2ECC71);border:none;border-radius:8px;padding:10px 24px;color:white;font-family:var(--font-body);font-size:13px;font-weight:600;cursor:pointer;transition:opacity .2s,transform .1s;display:flex;align-items:center;gap:8px;}
.btn-approve:hover{opacity:.9;transform:translateY(-1px);}
.btn-approve.approved{background:linear-gradient(135deg,#1a9e55,#27ae60);cursor:default;opacity:.8;}

.empty-state{padding:60px;text-align:center;color:var(--text-dim);font-size:13px;}

/* ── PRINT ──────────────────────────────────────────────────── */
@media print {
  @page { margin:15mm 18mm; size:A4; }

  /* ── Hide UI chrome ── */

function checkPW() {

// ── THEME ─────────────────────────────────────────────────────
function toggleTheme() {
  const html=document.documentElement, isDark=html.getAttribute('data-theme')==='dark', next=isDark?'light':'dark';
  html.setAttribute('data-theme',next);
  document.getElementById('theme-icon').textContent  = isDark?'🌙':'☀️';
  document.getElementById('theme-label').textContent = isDark?'Dark':'Light';
  localStorage.setItem('ss_theme',next);
}
function loadTheme() {
  const t=localStorage.getItem('ss_theme');
  if(t){ document.documentElement.setAttribute('data-theme',t); document.getElementById('theme-icon').textContent=t==='light'?'🌙':'☀️'; document.getElementById('theme-label').textContent=t==='light'?'Dark':'Light'; }
}

// ── HELPERS ───────────────────────────────────────────────────
function parseDate(v){ if(!v)return null; const d=new Date(v); return isNaN(d)?null:d; }
function parseAmt(v) { const n=parseFloat(String(v||'').replace(/[$,\s]/g,'')); return isNaN(n)?0:n; }
function isTRUE(v)   { return ['true','1','yes'].includes(String(v||'').trim().toLowerCase()); }
function money(v)    { if(!v||isNaN(v))return '$0.00'; return (v<0?'-':'')+'$'+Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d)  { if(!d)return '—'; return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtDI(d)    { if(!d)return ''; const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),dd=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${dd}`; }
function isShowStatus(st){ const s=(st||'').trim().toLowerCase(); return s.startsWith('show')||s.includes('follow up')||s.includes('follow-up')||s.includes('followup'); }
function getPeriod(pv){ const pd=new Date(pv+'T12:00:00'); return { start:new Date(pd.getFullYear(),pd.getMonth()-1,1), end:new Date(pd.getFullYear(),pd.getMonth(),0,23,59,59) }; }

// ── DATA ──────────────────────────────────────────────────────
async function apiFetch(sheetId, range) {
  const url=`https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/${encodeURIComponent(range)}?key=AIzaSyC7WtRVmLS2mo53i_Cge8NAlJ5tB2kaHjE`;
  const res=await fetch(url);
  if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(e.error?.message||`HTTP ${res.status}`);}
  return (await res.json()).values||[];
}

async function loadCloserData() {
  if(dataLoaded.closer) return;
  const meta=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CLOSER_SHEET}?key=AIzaSyC7WtRVmLS2mo53i_Cge8NAlJ5tB2kaHjE&fields=sheets.properties.title`);
  if(!meta.ok) throw new Error('Cannot access closer spreadsheet.');
  const tabs=(await meta.json()).sheets.map(s=>s.properties.title);
  const find=(...names)=>{ for(const n of names){const t=tabs.find(t=>t.toLowerCase()===n.toLowerCase());if(t)return t;} for(const n of names){const t=tabs.find(t=>t.toLowerCase().includes(n.toLowerCase()));if(t)return t;} return null; };
  const msTab=find('IMPORT - MASTERSHEET','MASTERSHEET'), gcTab=find('IMPORT - GC MASTERSHEET','GC MASTERSHEET');
  if(!msTab) throw new Error('Mastersheet tab not found.');
  const [msRows,gcRows]=await Promise.all([apiFetch(CLOSER_SHEET,`'${msTab}'!A1:AE3000`), gcTab?apiFetch(CLOSER_SHEET,`'${gcTab}'!A1:S3000`):Promise.resolve([])]);
  raw.ms=msRows.slice(1).filter(r=>r&&r.length);
  raw.gc=gcRows.slice(1).filter(r=>r&&r.length);
  dataLoaded.closer=true;
}

async function loadCoachData() {
  if(dataLoaded.coaches) return;
  const meta=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${COACHES_SHEET}?key=AIzaSyC7WtRVmLS2mo53i_Cge8NAlJ5tB2kaHjE&fields=sheets.properties.title`);
  if(!meta.ok) throw new Error('Cannot access coaches spreadsheet.');
  const tabs=(await meta.json()).sheets.map(s=>s.properties.title);
  const find=(...names)=>{ for(const n of names){const t=tabs.find(t=>t.toLowerCase()===n.toLowerCase());if(t)return t;} for(const n of names){const t=tabs.find(t=>t.toLowerCase().includes(n.toLowerCase()));if(t)return t;} return null; };
  const cmTab=find('Client Mastersheet','Client Master');
  if(!cmTab) throw new Error(`"Client Mastersheet" tab not found. Available: ${tabs.join(', ')}`);
  const rows=await apiFetch(COACHES_SHEET,`'${cmTab}'!A1:Z3000`);
  raw.cm=rows.slice(1).filter(r=>r&&r.length);
  dataLoaded.coaches=true;
}

async function loadSetterData() {
  if(dataLoaded.setter) return;
  const meta=await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${CLOSER_SHEET}?key=AIzaSyC7WtRVmLS2mo53i_Cge8NAlJ5tB2kaHjE&fields=sheets.properties.title`);
  if(!meta.ok) throw new Error('Cannot access closer spreadsheet.');
  const tabs=(await meta.json()).sheets.map(s=>s.properties.title);
  const find=(...names)=>{ for(const n of names){const t=tabs.find(t=>t.toLowerCase()===n.toLowerCase());if(t)return t;} for(const n of names){const t=tabs.find(t=>t.toLowerCase().includes(n.toLowerCase()));if(t)return t;} return null; };
  const laTab=find('IMPORT - LEADS APPLIED','LEADS APPLIED');
  if(!laTab) throw new Error(`"IMPORT - LEADS APPLIED" tab not found. Available: ${tabs.join(', ')}`);
  const rows=await apiFetch(CLOSER_SHEET,`'${laTab}'!A1:V3000`);
  raw.la=rows.slice(1).filter(r=>r&&r.length);
  dataLoaded.setter=true;
}

// Used when loading the Closer tab: the "21 DC Set Commission" needs raw.la, but a problem
// with the Leads Applied tab (e.g. the known Setter tab issue) should not block Closer Commission.
async function loadSetterDataSafe() {
  try { await loadSetterData(); }

async function switchTab(tab, btn) {
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));

  document.querySelectorAll('.tab-pane').forEach(p=>p.classList.remove('active'));

  showLoading(true);
  try {
    if(tab==='closer')  { await loadCloserData(); await loadSetterDataSafe(); renderCloser(); }
    if(tab==='coaches') { await loadCoachData();   buildSalaryGrid(); renderCoach(); }
    if(tab==='setter')  { await loadSetterData();  renderSetter(); }
  } catch(e) { alert('Error loading data: '+e.message); }
  showLoading(false);
}

function showLoading(v){ document.getElementById('loading').style.display=v?'flex':'none'; }

function markUpdated(){
  const el=document.getElementById('last-updated');
  if(el) el.textContent='Updated '+new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}

// ── REFRESH DATA ────────────────────────────────────────────────
async function refreshData() {
  const btn=document.getElementById('refresh-btn');
  const orig=btn?btn.innerHTML:'';
  if(btn){ btn.disabled=true; btn.innerHTML='⏳ Refreshing…'; }
  // Force a re-fetch next time each tab's data is requested
  dataLoaded.closer=false;
  dataLoaded.coaches=false;
  dataLoaded.setter=false;
  showLoading(true);
  try {
    if(currentTab==='closer')  { await loadCloserData(); await loadSetterDataSafe(); renderCloser(); }
    if(currentTab==='coaches') { await loadCoachData();   buildSalaryGrid(); renderCoach(); }
    if(currentTab==='setter')  { await loadSetterData();  renderSetter(); }
    markUpdated();
  } catch(e) { alert('Error refreshing data: '+e.message); }
  showLoading(false);
  if(btn){ btn.disabled=false; btn.innerHTML=orig; }
}

// ── CLOSER RENDER ─────────────────────────────────────────────
function renderCloser() {
  const container=document.getElementById('closer-slip');
  const pd=document.getElementById('cl-pay-date')?.value;
  if(!pd||!dataLoaded.closer){container.innerHTML='<div class="empty-state">Select a pay date to generate the payroll slip.</div>';return;}
  const {start,end}=getPeriod(pd);
  const cLow='deniz';
  const inR=(d)=>d&&d>=start&&d<=end;

  const msComm=raw.ms.filter(r=>(r[MS.closer]||'').toLowerCase().includes(cLow)&&!isTRUE(r[MS.refundFlag])&&inR(parseDate(r[MS.payoutDate])));
  const gcComm=raw.gc.filter(r=>(r[GC.closer]||'').toLowerCase().includes(cLow)&&!isTRUE(r[GC.excludeFlag])&&inR(parseDate(r[GC.payoutDate])));
  const msRef =raw.ms.filter(r=>(r[MS.closer]||'').toLowerCase()===cLow&&isTRUE(r[MS.refundFlag])&&inR(parseDate(r[MS.refundDate])));

  // 21 DC Set Commission: $100 flat per Challenger lead in "IMPORT - LEADS APPLIED" where
  // col Q (Source/setter) = Deniz AND col M (Closer) = Dr. Joey AND col N (Purchased) = "Yes",
  // matched by Sales Call Booked Date (col K). Excludes refunds (col V = TRUE).
  // (Deniz does not earn this on sets she closes herself — enforced naturally since closer must be Joey.)
  const dcCalls=raw.la.filter(r=>(r[LA.source]||'').toLowerCase().includes(cLow)&&(r[LA.closer]||'').toLowerCase().includes('joey')&&(r[LA.purchased]||'').trim().toLowerCase()==='yes'&&!isTRUE(r[LA.refundFlag])&&inR(parseDate(r[LA.bookedDate])))
    .sort((a,b)=>(parseDate(a[LA.bookedDate])?.getTime()||0)-(parseDate(b[LA.bookedDate])?.getTime()||0));
  const dcSetComm=dcCalls.length*100;
  // Refunded leads (col V = TRUE) that would otherwise match — shown for visibility, not paid.
  const dcRefunds=raw.la.filter(r=>(r[LA.source]||'').toLowerCase().includes(cLow)&&(r[LA.closer]||'').toLowerCase().includes('joey')&&(r[LA.purchased]||'').trim().toLowerCase()==='yes'&&isTRUE(r[LA.refundFlag])&&inR(parseDate(r[LA.bookedDate])));
  const dcAll=[
    ...dcCalls.map(r=>({name:`${r[LA.firstName]||''} ${r[LA.lastName]||''}`.trim(),email:r[LA.email],bookedDate:parseDate(r[LA.bookedDate]),isRefund:false})),
    ...dcRefunds.map(r=>({name:`${r[LA.firstName]||''} ${r[LA.lastName]||''}`.trim(),email:r[LA.email],bookedDate:parseDate(r[LA.bookedDate]),isRefund:true})),
  ].sort((a,b)=>(a.bookedDate?.getTime()||0)-(b.bookedDate?.getTime()||0));

  const htCash=msComm.reduce((s,r)=>s+parseAmt(r[MS.cashCollected]),0);
  const gcCash=gcComm.reduce((s,r)=>s+parseAmt(r[GC.cashCollected]),0);
  const totalCash=htCash+gcCash;
  const T1=12500,T2=25000;
  const t1=Math.min(totalCash,T1),t2=totalCash>T1?Math.min(totalCash-T1,T2-T1):0,t3=totalCash>T2?totalCash-T2:0;
  const tierComm=(t1*.10)+(t2*.125)+(t3*.15);
  const baseSalary=parseAmt(document.getElementById('cl-base-salary')?.value)||0;
  const totalPayment=tierComm+baseSalary+dcSetComm;
  const notes=document.getElementById('cl-notes')?.value||'';
  const approveKey=`closer|${pd}`;
  const approved=!!approvedMap[approveKey];
  const periodLabel=start.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  const clients=[
    ...msComm.map(r=>({name:`${r[MS.firstName]||''} ${r[MS.lastName]||''}`.trim(),saleDate:parseDate(r[MS.saleDate]),payoutDate:parseDate(r[MS.payoutDate]),cc:parseAmt(r[MS.cashCollected]),deal:parseAmt(r[MS.dealValue])})),
    ...gcComm.map(r=>({name:`${r[GC.firstName]||''} ${r[GC.lastName]||''}`.trim(),saleDate:parseDate(r[GC.saleDate]),payoutDate:parseDate(r[GC.payoutDate]),cc:parseAmt(r[GC.cashCollected]),deal:parseAmt(r[GC.dealValue])})),
  ].sort((a,b)=>(a.payoutDate?.getTime()||0)-(b.payoutDate?.getTime()||0));

  // Refunds get their own table — kept separate from Client Breakdown so it's clear
  // these amounts are NOT subtracted from the commission (they were already excluded
  // from totalCash above, since msComm filters out refunded rows entirely).
  const refundEntries=msRef.map(r=>({name:`${r[MS.firstName]||''} ${r[MS.lastName]||''}`.trim(),saleDate:parseDate(r[MS.saleDate]),refundDate:parseDate(r[MS.refundDate]),cc:parseAmt(r[MS.cashCollected])}))
    .sort((a,b)=>(a.refundDate?.getTime()||0)-(b.refundDate?.getTime()||0));

  const tierRows=[{label:'Tier 1 ($0 – $12,500)',amount:t1,rate:'10.00%',comm:t1*.10},{label:'Tier 2 ($12,500 – $25,000)',amount:t2,rate:'12.50%',comm:t2*.125},{label:'Tier 3 ($25,000+)',amount:t3,rate:'15.00%',comm:t3*.15}]
    .filter(t=>t.amount>0).map(t=>`<tr><td class="tier-label">${t.label}</td><td>${money(t.amount)}</td><td style="color:var(--text-muted)">${t.rate}</td><td style="color:var(--gold);font-weight:500">${money(t.comm)}</td></tr>`).join('');

  const clientRows=clients.map(c=>`<tr>
    <td style="font-weight:500">${c.name||'—'}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(c.saleDate)}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(c.payoutDate)}</td>
    <td style="font-family:var(--font-display);color:var(--steel-light)">${money(c.cc)}</td>
    <td style="font-family:var(--font-display);color:var(--text-muted)">${money(c.deal)}</td>
  </tr>`).join('');

  const refundRows=refundEntries.map(c=>`<tr>
    <td style="font-weight:500;color:var(--red)">${c.name||'—'}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(c.saleDate)}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(c.refundDate)}</td>
    <td style="font-family:var(--font-display);color:var(--red)">${money(0)}</td>
  </tr>`).join('');

  const dcRows=dcAll.map(c=>`<tr style="${c.isRefund?'background:rgba(231,76,60,0.05)':''}">
    <td style="font-weight:500;${c.isRefund?'color:var(--red)':''}">${c.name||'—'}${c.isRefund?' <span class="tag tag-nonq">REFUND</span>':''}</td>
    <td style="color:var(--text-muted)">${c.email||'—'}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(c.bookedDate)}</td>
    <td style="font-family:var(--font-display);font-weight:500;${c.isRefund?'color:var(--red)':'color:var(--gold)'}">${c.isRefund?'Not paid (refund)':money(100)}</td>
  </tr>`).join('');

  container.innerHTML=`<div class="slip">
    <div class="slip-header">
      <div><div class="slip-brand">STRONG STANDARD <span>Closer Commission Slip</span></div></div>
      <div style="text-align:right"><div class="slip-name">DENIZ</div><div class="slip-period">${periodLabel}</div></div>
    </div>
    <div class="slip-dates">
      <div class="slip-date-cell"><div class="slip-date-label">Pay Date</div><div class="slip-date-val">${fmtDate(parseDate(pd+'T12:00:00'))}</div></div>
      <div class="slip-date-cell"><div class="slip-date-label">Period Start</div><div class="slip-date-val">${fmtDate(start)}</div></div>
      <div class="slip-date-cell"><div class="slip-date-label">Period End</div><div class="slip-date-val">${fmtDate(end)}</div></div>
    </div>
    <div class="slip-summary">
      <div class="slip-left">
        <div class="section-title">Payment Breakdown</div>
        <div class="sum-row"><span class="sum-label">Close Commission</span><span class="sum-val gold">${money(tierComm)}</span></div>
        <div class="sum-row"><span class="sum-label">Base Salary</span><span class="sum-val">${money(baseSalary)}</span></div>
        <div class="sum-row"><span class="sum-label">21 DC Set Commission</span><span class="sum-val gold">${money(dcSetComm)}</span></div>
        <div class="sum-row total"><span class="sum-label" style="font-weight:600;color:var(--text)">Total Payment</span><span class="sum-val big">${money(totalPayment)}</span></div>
      </div>
      <div class="slip-right">
        <div class="section-title">Cash Collected</div>
        <div class="sum-row"><span class="sum-label">101 (HT)</span><span class="sum-val green">${money(htCash)}</span></div>
        <div class="sum-row"><span class="sum-label">GC (LT)</span><span class="sum-val green">${money(gcCash)}</span></div>
        ${msRef.length>0?`<div class="sum-row"><span class="sum-label">Refunds</span><span class="sum-val" style="color:var(--red)">${msRef.length} this period</span></div>`:''}
        <div class="sum-row total"><span class="sum-label" style="font-weight:600;color:var(--text)">Total Cash Collected</span><span class="sum-val green" style="font-size:16px;font-weight:600">${money(totalCash)}</span></div>
      </div>
    </div>
    <div class="slip-section closer-section">
      <div class="section-header-bar closer-bar"><span class="sh-title">Commission Tiers</span><span class="count-badge">${money(tierComm)} total</span></div>
      <div style="padding:4px 0"><table class="tier-table">
        <thead><tr><th>Tier</th><th style="text-align:right">Cash Collected</th><th style="text-align:right">Rate</th><th style="text-align:right">Commission</th></tr></thead>
        <tbody>${tierRows}</tbody>
        <tfoot><tr><td style="font-weight:700">Total</td><td style="color:var(--steel-light)">${money(totalCash)}</td><td></td><td style="color:var(--gold)">${money(tierComm)}</td></tr></tfoot>
      </table></div>
    </div>
    ${dcAll.length>0?`<div class="slip-section closer-section">
      <div class="section-header-bar closer-bar"><span class="sh-title">21 DC Set Breakdown</span><span class="count-badge">${dcCalls.length} paid &nbsp;·&nbsp; ${money(dcSetComm)}${dcRefunds.length>0?` &nbsp;·&nbsp; ${dcRefunds.length} refunded`:''}</span></div>
      <table class="data-table"><thead><tr><th>Lead</th><th>Email</th><th>Booked Date</th><th>Commission ($100 flat)</th></tr></thead>
      <tbody>${dcRows}</tbody></table>
    </div>`:''}
    ${clients.length>0?`<div class="slip-section active-section">
      <div class="section-header-bar active-bar"><span class="sh-title">Client Breakdown</span><span class="count-badge">${clients.length} clients</span></div>
      <table class="data-table"><thead><tr><th>Client</th><th>Sale Date</th><th>Payout Date</th><th>Cash Collected</th><th>Deal Value</th></tr></thead>
      <tbody>${clientRows}</tbody></table></div>`:''}
    ${refundEntries.length>0?`<div class="slip-section nonq-section">
      <div class="section-header-bar nonq-bar"><span class="sh-title">Refunds</span><span class="count-badge">${refundEntries.length} refunded &nbsp;·&nbsp; not counted in commission</span></div>
      <table class="data-table"><thead><tr><th>Client</th><th>Sale Date</th><th>Refund Date</th><th>Amount</th></tr></thead>
      <tbody>${refundRows}</tbody></table></div>`:''}
    ${notes?`<div style="padding:14px 28px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)">📝 ${notes}</div>`:''}
    <div class="slip-footer">
      <div class="status-wrap"><div class="status-dot ${approved?'approved':''}"></div><span class="status-text">${approved?'✓ Approved — Ready to send payment':'Pending approval'}</span></div>
      <div class="footer-btns">
        <button class="btn-pdf" onclick="generatePDF(this)">🖨 Generate PDF</button>

      </div>
    </div>
  </div>`;

// ── CUSTOM ITEMS (coaches) ─────────────────────────────────────
function loadCustomItems(){ try{ customItems=JSON.parse(localStorage.getItem('ss_co_custom_items')||'{}'); }catch(e){ customItems={}; } }
function saveCustomItems(){ try{ localStorage.setItem('ss_co_custom_items',JSON.stringify(customItems)); }catch(e){} }
function customKey(coach,pd){ return `${coach}|${pd}`; }
function getCustomItems(coach,pd){ return (coach&&pd&&customItems[customKey(coach,pd)])||[]; }

function renderCustomPanel(){
  const list=document.getElementById('co-custom-list');
  if(!list) return;
  const coach=document.getElementById('co-coach-select')?.value;
  const pd=document.getElementById('co-pay-date')?.value;
  if(!coach||!pd){ list.innerHTML='<div class="custom-empty">Select a coach and pay date first.</div>'; return; }
  const items=getCustomItems(coach,pd);
  if(!items.length){ list.innerHTML='<div class="custom-empty">No custom items for this period.</div>'; return; }
  list.innerHTML=items.map((it,i)=>`
    <div class="custom-item-row">
      <span class="custom-item-concept">${it.concept}</span>
      <span class="custom-item-amount">${money(it.amount)}</span>
      <button class="custom-item-remove" onclick="removeCustomItem(${i})" title="Remove">✕</button>
    </div>`).join('');
}

function addCustomItem(){
  const coach=document.getElementById('co-coach-select')?.value;
  const pd=document.getElementById('co-pay-date')?.value;
  if(!coach||!pd){ alert('Select a coach and pay date first.'); return; }
  const conceptInp=document.getElementById('co-custom-concept');
  const amountInp=document.getElementById('co-custom-amount');
  const concept=(conceptInp.value||'').trim();
  const amount=parseAmt(amountInp.value);
  if(!concept){ alert('Enter a concept/description.'); return; }
  if(!amount){ alert('Enter a valid amount.'); return; }
  const key=customKey(coach,pd);
  if(!customItems[key]) customItems[key]=[];
  customItems[key].push({concept,amount});
  saveCustomItems();
  conceptInp.value=''; amountInp.value='';
  renderCoach();
}

function removeCustomItem(i){
  const coach=document.getElementById('co-coach-select')?.value;
  const pd=document.getElementById('co-pay-date')?.value;
  const key=customKey(coach,pd);
  if(!customItems[key]) return;
  customItems[key].splice(i,1);
  saveCustomItems();
  renderCoach();
}

// ── COACH RENDER ──────────────────────────────────────────────
function setCoachSort(s){ coachSort=s; renderCoach(); }

function renderCoach() {
  renderCustomPanel();
  const container=document.getElementById('coach-slip');
  const pd=document.getElementById('co-pay-date')?.value;
  const coach=document.getElementById('co-coach-select')?.value;
  if(!pd||!coach||!dataLoaded.coaches){container.innerHTML='<div class="empty-state">Select a coach and pay date to generate the payroll slip.</div>';return;}
  const {start,end}=getPeriod(pd);
  const july2025=new Date(2025,6,1);
  const inR=(d)=>d&&d>=start&&d<=end;

  const activeClients=raw.cm.filter(r=>{
    const sd=parseDate(r[CM.startDate]),ed=parseDate(r[CM.endDate]),tv=parseAmt(r[CM.tier]);
    return (r[CM.coach]||'').trim().toLowerCase()===coach.toLowerCase()&&sd&&sd<=end&&ed&&ed>end&&!isTRUE(r[CM.nonQFlag])&&tv>0&&!isTRUE(r[CM.excludeFlag]);
  });
  const retClients=raw.cm.filter(r=>{
    const sd=parseDate(r[CM.startDate]),ed=parseDate(r[CM.endDate]),sl=parseDate(r[CM.saleDate]);
    const edate=ed?new Date(ed.getFullYear(),ed.getMonth()-1,ed.getDate()):null;
    return (r[CM.coach]||'').trim().toLowerCase()===coach.toLowerCase()&&sd&&sd<=end&&edate&&edate>=start&&(r[CM.status]||'').trim().toLowerCase()==='resign'&&sl&&sl>=july2025;
  });
  const nonQClients=raw.cm.filter(r=>{
    const sl=parseDate(r[CM.saleDate]),tv=parseAmt(r[CM.tier]);
    return (r[CM.coach]||'').trim().toLowerCase()===coach.toLowerCase()&&sl&&sl>=start&&sl<=end&&isTRUE(r[CM.nonQFlag])&&tv>0;
  });

  const sortFn=coachSort==='enddate'
    ?(a,b)=>(parseDate(a[CM.endDate])?.getTime()||0)-(parseDate(b[CM.endDate])?.getTime()||0)
    :(a,b)=>(`${a[CM.firstName]} ${a[CM.lastName]}`).localeCompare(`${b[CM.firstName]} ${b[CM.lastName]}`);
  activeClients.sort(sortFn); retClients.sort(sortFn); nonQClients.sort(sortFn);

  const activeClientPay  = activeClients.reduce((s,r)=>s+parseAmt(r[CM.coachPay]),0);
  const retCommPay       = retClients.reduce((s,r)=>s+parseAmt(r[CM.retComm]),0);
  const baseSalary       = salaries[coach]||0;
  const customItemsArr   = getCustomItems(coach,pd);
  const customTotal      = customItemsArr.reduce((s,it)=>s+parseAmt(it.amount),0);
  const totalPayment     = activeClientPay+retCommPay+baseSalary+customTotal;
  const notes=document.getElementById('co-notes')?.value||'';
  const approveKey=`coach|${coach}|${pd}`;
  const approved=!!approvedMap[approveKey];
  const periodLabel=start.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  // Find duplicates WITHIN each section separately
  const countNames = (arr) => arr.reduce((acc,r)=>{ const n=`${r[CM.firstName]||''} ${r[CM.lastName]||''}`.trim().toLowerCase(); acc[n]=(acc[n]||0)+1; return acc; }, {});
  const activeCounts = countNames(activeClients);
  const retCounts    = countNames(retClients);
  const nonQCounts   = countNames(nonQClients);
  const isDupeIn = (counts, r) => counts[`${r[CM.firstName]||''} ${r[CM.lastName]||''}`.trim().toLowerCase()] > 1;
  const dupeStyle = 'background:rgba(255,220,50,0.15);border-left:3px solid rgba(255,200,0,0.7)';

  const dupTag = `<span style="font-size:10px;background:rgba(255,200,0,0.25);color:#9a7000;border-radius:4px;padding:1px 6px;margin-left:4px;font-family:var(--font-body)">⚠ dup</span>`;
  const activeRows=activeClients.map(r=>`<tr style="${isDupeIn(activeCounts,r)?dupeStyle:''}">
    <td style="font-weight:500">${r[CM.firstName]||''} ${r[CM.lastName]||''}${isDupeIn(activeCounts,r)?dupTag:''}</td>
    <td style="color:var(--text-muted)">${r[CM.product]||'—'}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(parseDate(r[CM.startDate]))}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(parseDate(r[CM.endDate]))}</td>
    <td style="font-family:var(--font-display);color:var(--green);font-weight:500">${money(parseAmt(r[CM.coachPay]))}</td>
  </tr>`).join('');

  const retRows=retClients.map(r=>`<tr style="${isDupeIn(retCounts,r)?dupeStyle:''}">
    <td style="font-weight:500">${r[CM.firstName]||''} ${r[CM.lastName]||''}${isDupeIn(retCounts,r)?dupTag:''}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(parseDate(r[CM.startDate]))}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(parseDate(r[CM.endDate]))}</td>
    <td><span class="tag tag-resign">Resign</span></td>
    <td style="font-family:var(--font-display);color:var(--purple);font-weight:500">${money(parseAmt(r[CM.retComm]))}</td>
  </tr>`).join('');

  const nonQRows=nonQClients.map(r=>`<tr style="${isDupeIn(nonQCounts,r)?dupeStyle:''}">
    <td style="font-weight:500">${r[CM.firstName]||''} ${r[CM.lastName]||''}${isDupeIn(nonQCounts,r)?dupTag:''}</td>
    <td style="color:var(--text-muted)">${r[CM.product]||'—'}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(parseDate(r[CM.saleDate]))}</td>
    <td><span class="tag tag-nonq">Non-Qualifier</span></td>
  </tr>`).join('');

  container.innerHTML=`<div class="slip">
    <div class="slip-header">
      <div><div class="slip-brand">STRONG STANDARD <span>Coach Commission Slip</span></div></div>
      <div style="text-align:right"><div class="slip-name">${coach.toUpperCase()}</div><div class="slip-period">${periodLabel}</div></div>
    </div>
    <div class="slip-dates">
      <div class="slip-date-cell"><div class="slip-date-label">Pay Date</div><div class="slip-date-val">${fmtDate(parseDate(pd+'T12:00:00'))}</div></div>
      <div class="slip-date-cell"><div class="slip-date-label">Period Start</div><div class="slip-date-val">${fmtDate(start)}</div></div>
      <div class="slip-date-cell"><div class="slip-date-label">Period End</div><div class="slip-date-val">${fmtDate(end)}</div></div>
    </div>
    <div class="slip-summary">
      <div class="slip-left">
        <div class="section-title">Payment Breakdown</div>
        <div class="sum-row"><span class="sum-label">Active Client Pay</span><span class="sum-val green">${money(activeClientPay)}</span></div>
        <div class="sum-row"><span class="sum-label">Retention Commission</span><span class="sum-val purple">${money(retCommPay)}</span></div>
        <div class="sum-row"><span class="sum-label">Base Salary</span><span class="sum-val">${money(baseSalary)}</span></div>
        ${customItemsArr.map(it=>`<div class="sum-row"><span class="sum-label">${it.concept}</span><span class="sum-val gold">${money(it.amount)}</span></div>`).join('')}
        <div class="sum-row total"><span class="sum-label" style="font-weight:600;color:var(--text)">Total Payment</span><span class="sum-val big">${money(totalPayment)}</span></div>
      </div>
      <div class="slip-right">
        <div class="section-title">Summary</div>
        <div class="sum-row"><span class="sum-label">Active Clients</span><span class="sum-val">${activeClients.length}</span></div>
        <div class="sum-row"><span class="sum-label">Retention Clients</span><span class="sum-val purple">${retClients.length}</span></div>
        <div class="sum-row"><span class="sum-label">Non-Qualifiers</span><span class="sum-val" style="color:${nonQClients.length>0?'var(--red)':'var(--text-dim)'}">${nonQClients.length}</span></div>
      </div>
    </div>
    <div class="sort-bar">
      <span class="sort-label">Sort by</span>
      <button class="sort-btn ${coachSort==='name'?'active':''}"    onclick="setCoachSort('name')">Name</button>
      <button class="sort-btn ${coachSort==='enddate'?'active':''}" onclick="setCoachSort('enddate')">End Date</button>
    </div>
    <div class="slip-section active-section">
      <div class="section-header-bar active-bar"><span class="sh-title">Active Clients</span><span class="count-badge">${activeClients.length} clients &nbsp;·&nbsp; ${money(activeClientPay)}</span></div>
      ${activeClients.length>0?`<table class="data-table"><thead><tr><th>Client</th><th>Product</th><th>Start Date</th><th>End Date</th><th>Coach Pay</th></tr></thead><tbody>${activeRows}</tbody></table>`:'<div class="empty-section">No active clients this period</div>'}
    </div>
    <div class="slip-section retention-section">
      <div class="section-header-bar retention-bar"><span class="sh-title">Retention Commission</span><span class="count-badge">${retClients.length} clients &nbsp;·&nbsp; ${money(retCommPay)}</span></div>
      ${retClients.length>0?`<table class="data-table"><thead><tr><th>Client</th><th>Start Date</th><th>End Date</th><th>Status</th><th>Commission</th></tr></thead><tbody>${retRows}</tbody></table>`:'<div class="empty-section">No retention commissions this period</div>'}
    </div>
    ${nonQClients.length>0?`<div class="slip-section nonq-section">
      <div class="section-header-bar nonq-bar"><span class="sh-title">Non-Qualifiers</span><span class="count-badge">${nonQClients.length} clients &nbsp;·&nbsp; not included in pay</span></div>
      <table class="data-table"><thead><tr><th>Client</th><th>Product</th><th>Sale Date</th><th>Status</th></tr></thead><tbody>${nonQRows}</tbody></table>
    </div>`:''}
    ${notes?`<div style="padding:14px 28px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)">📝 ${notes}</div>`:''}
    <div class="slip-footer">
      <div class="status-wrap"><div class="status-dot ${approved?'approved':''}"></div><span class="status-text">${approved?'✓ Approved — Ready to send payment':'Pending approval'}</span></div>
      <div class="footer-btns">
        <button class="btn-pdf" onclick="generatePDF(this)">🖨 Generate PDF</button>
        <button class="btn-approve ${approved?'approved':''}" onclick="doApprove('${approveKey}','coach')" id="co-approve-btn">${approved?'✓ Approved':'✓ Approve & Send'}</button>
      </div>
    </div>
  </div>`;
}

// ── SETTER RENDER ───────────────────────────────────────────────
function renderSetter() {
  const container=document.getElementById('setter-slip');
  const pd=document.getElementById('st-pay-date')?.value;
  const setter=document.getElementById('st-setter-select')?.value;
  if(!pd||!setter||!dataLoaded.setter){container.innerHTML='<div class="empty-state">Select a setter and pay date to generate the slip.</div>';return;}
  const {start,end}=getPeriod(pd);
  const inR=(d)=>d&&d>=start&&d<=end;
  const sLow=setter.trim().toLowerCase();

  // All calls booked by this setter in the period (regardless of show status)
  const setterLeads=raw.la.filter(r=>(r[LA.source]||'').toLowerCase().includes(sLow)&&inR(parseDate(r[LA.bookedDate])));
  const showLeads=setterLeads.filter(r=>isShowStatus(r[LA.showStatus]));

  // Dynamic breakdown by whatever status values actually appear in the sheet (Showed, No Show, Cancelled, Disqualified, etc.)
  const statusCounts={};
  setterLeads.forEach(r=>{
    const st=(r[LA.showStatus]||'').trim()||'(blank)';
    statusCounts[st]=(statusCounts[st]||0)+1;
  });
  const statusRows=Object.entries(statusCounts)
    .sort((a,b)=>b[1]-a[1])
    .map(([st,count])=>{
      const isShow=isShowStatus(st);
      return `<div class="sum-row"><span class="sum-label">${st}</span><span class="sum-val${isShow?' green':''}">${count}</span></div>`;
    }).join('');

  const notes=document.getElementById('st-notes')?.value||'';
  const approveKey=`setter|${setter}|${pd}`;
  const approved=!!approvedMap[approveKey];
  const periodLabel=start.toLocaleDateString('en-US',{month:'long',year:'numeric'});

  setterLeads.sort((a,b)=>(parseDate(a[LA.bookedDate])?.getTime()||0)-(parseDate(b[LA.bookedDate])?.getTime()||0));

  const setterRows=setterLeads.map(r=>{
    const isShow=isShowStatus(r[LA.showStatus]);
    const statusLabel=(r[LA.showStatus]||'—').trim();
    return `<tr style="${isShow?'':'background:rgba(231,76,60,0.05)'}">
    <td style="font-weight:500">${r[LA.firstName]||''} ${r[LA.lastName]||''}</td>
    <td style="color:var(--text-muted)">${r[LA.email]||'—'}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(parseDate(r[LA.bookedDate]))}</td>
    <td><span class="tag ${isShow?'tag-closed':'tag-nonq'}">${statusLabel}</span></td>
  </tr>`;
  }).join('');

  // ── DATA HYGIENE ALERT ──────────────────────────────────────
  // A call whose booked date has already passed should have a resolved outcome
  // (Showed / Follow Up / No Show / Cancelled / Disqualified / Rescheduled, etc). If it's still
  // sitting on a "pre-call" status like "Confirmed", nobody updated it after the call —
  // and that call won't get counted correctly for setter pay.
  const today=new Date(); today.setHours(0,0,0,0);
  const isResolvedStatus=(st)=>{
    const s=(st||'').trim().toLowerCase();
    return isShowStatus(s) || s.includes('no show') || s.includes('no-show') ||
           s.includes('cancel') || s.includes('disqualif') || s.includes('reschedul');
  };
  const staleCalls=setterLeads.filter(r=>{
    const bd=parseDate(r[LA.bookedDate]);
    const st=(r[LA.showStatus]||'').trim();
    return bd && bd<today && !isResolvedStatus(st);
  });

  const staleRows=staleCalls.map(r=>{
    const bd=parseDate(r[LA.bookedDate]);
    const daysAgo=Math.floor((today-bd)/86400000);
    return `<tr>
    <td style="font-weight:500">${r[LA.firstName]||''} ${r[LA.lastName]||''}</td>
    <td style="color:var(--text-muted)">${r[LA.closer]||'—'}</td>
    <td style="color:var(--text-dim);font-family:var(--font-display)">${fmtDate(bd)}</td>
    <td style="color:var(--red);font-family:var(--font-display)">${daysAgo} day${daysAgo!==1?'s':''} ago</td>
    <td><span class="tag tag-nonq">${r[LA.showStatus]||'(blank)'}</span></td>
  </tr>`;
  }).join('');

  const alertBanner=staleCalls.length>0?`<div class="alert-banner">
    <div class="alert-banner-header">⚠️ ${staleCalls.length} call${staleCalls.length>1?'s':''} already happened but ${staleCalls.length>1?"still show":"still shows"} a pre-call status — this affects setter pay accuracy. Update these in the sheet.</div>
    <table class="data-table"><thead><tr><th>Lead</th><th>Sales Person</th><th>Booked Date</th><th>Overdue</th><th>Current Status</th></tr></thead><tbody>${staleRows}</tbody></table>
  </div>`:'';

  container.innerHTML=`${alertBanner}<div class="slip">
    <div class="slip-header">
      <div><div class="slip-brand">STRONG STANDARD <span>Setter Call Slip</span></div></div>
      <div style="text-align:right"><div class="slip-name">${setter.toUpperCase()}</div><div class="slip-period">${periodLabel}</div></div>
    </div>
    <div class="slip-dates">
      <div class="slip-date-cell"><div class="slip-date-label">Pay Date</div><div class="slip-date-val">${fmtDate(parseDate(pd+'T12:00:00'))}</div></div>
      <div class="slip-date-cell"><div class="slip-date-label">Period Start</div><div class="slip-date-val">${fmtDate(start)}</div></div>
      <div class="slip-date-cell"><div class="slip-date-label">Period End</div><div class="slip-date-val">${fmtDate(end)}</div></div>
    </div>
    <div class="slip-summary">
      <div class="slip-left">
        <div class="section-title">Summary</div>
        <div class="sum-row total"><span class="sum-label" style="font-weight:600;color:var(--text)">Calls Booked (Show)</span><span class="sum-val big">${showLeads.length}</span></div>
      </div>
      <div class="slip-right">
        <div class="section-title">Breakdown</div>
        <div class="sum-row"><span class="sum-label">Total Booked</span><span class="sum-val">${setterLeads.length}</span></div>
        ${statusRows}
      </div>
    </div>
    <div class="slip-section active-section">
      <div class="section-header-bar active-bar"><span class="sh-title">Calls Booked</span><span class="count-badge">${setterLeads.length} calls &nbsp;·&nbsp; ${showLeads.length} show</span></div>
      ${setterLeads.length>0?`<table class="data-table"><thead><tr><th>Lead</th><th>Email</th><th>Booked Date</th><th>Status</th></tr></thead><tbody>${setterRows}</tbody></table>`:'<div class="empty-section">No calls booked this period</div>'}
    </div>
    ${notes?`<div style="padding:14px 28px;border-top:1px solid var(--border);font-size:12px;color:var(--text-muted)">📝 ${notes}</div>`:''}
    <div class="slip-footer">
      <div class="status-wrap"><div class="status-dot ${approved?'approved':''}"></div><span class="status-text">${approved?'✓ Approved — Ready to send payment':'Pending approval'}</span></div>
      <div class="footer-btns">
        <button class="btn-pdf" onclick="generatePDF(this)">🖨 Generate PDF</button>
        <button class="btn-approve ${approved?'approved':''}" onclick="doApprove('${approveKey}','setter')" id="st-approve-btn">${approved?'✓ Approved':'✓ Approve & Send'}</button>
      </div>
    </div>
  </div>`;
}

// ── GENERATE PDF ─────────────────────────────────────────────
async function generatePDF(btn) {
  const slip = document.querySelector('.tab-pane.active .slip');
  if (!slip) return;

  // Button feedback
  const orig = btn.innerHTML;
  btn.innerHTML = '⏳ Generating…';
  btn.disabled = true;

  // Temporarily hide footer so it doesn't appear in PDF
  const footer = slip.querySelector('.slip-footer');
  if (footer) footer.style.display = 'none';

  try {
    await document.fonts.ready;

    const isDark = document.documentElement.getAttribute('data-theme') !== 'light';
    const bgColor = isDark ? '#0f1729' : '#ffffff';

    // Temporarily expand slip so html2canvas captures full height
    const prevOverflow = slip.style.overflow;
    slip.style.overflow = 'visible';

    const canvas = await html2canvas(slip, {
      scale: 2,
      useCORS: true,
      allowTaint: true,
      backgroundColor: bgColor,
      logging: false,
      scrollX: 0,
      scrollY: 0,
      width:  slip.scrollWidth,
      height: slip.scrollHeight,
    });

    slip.style.overflow = prevOverflow;

    const { jsPDF } = window.jspdf;
    const imgData = canvas.toDataURL('image/png');

    // A4: 210 x 297 mm, margins 12mm
    const margin  = 12;
    const pageW   = 210, pageH = 297;
    const usableW = pageW - margin * 2;
    const imgW    = canvas.width, imgH = canvas.height;
    const ratio   = imgH / imgW;
    const printH  = usableW * ratio;

    const pdf = new jsPDF({ unit:'mm', format:'a4', orientation:'portrait' });

    if (printH <= pageH - margin * 2) {
      // Fits on one page
      pdf.addImage(imgData, 'PNG', margin, margin, usableW, printH);
    } else {
      // Multi-page: slice canvas into page-height chunks
      const pageImgH = Math.floor(imgH * ((pageH - margin * 2) / printH)); // pixels per page
      let yPos = 0, pageNum = 0;
      while (yPos < imgH) {
        const sliceH  = Math.min(pageImgH, imgH - yPos);
        const sliceC  = document.createElement('canvas');
        sliceC.width  = imgW;
        sliceC.height = sliceH;
        sliceC.getContext('2d').drawImage(canvas, 0, -yPos);
        const sliceImg = sliceC.toDataURL('image/png');
        if (pageNum > 0) pdf.addPage();
        pdf.addImage(sliceImg, 'PNG', margin, margin, usableW, usableW * (sliceH / imgW));
        yPos += pageImgH;
        pageNum++;
      }
    }

    // Build filename: "Coach Payroll Brent - June 2026" or "Closer Payroll Deniz - June 2026"
    const nameEl    = slip.querySelector('.slip-name');
    const personName = (nameEl?.textContent || '').trim();
    const periodEl  = slip.querySelector('.slip-period');
    const period    = (periodEl?.textContent || '').trim();
    const typeMap   = { coaches:'Coach Payroll', setter:'Setter Payroll' };
    const type      = typeMap[currentTab] || 'Closer Payroll';
    pdf.save(`${type} ${personName} - ${period}.pdf`);

  } catch(e) {
    console.error(e);
    alert('PDF generation failed: ' + e.message);
  } finally {
    if (footer) footer.style.display = '';
    slip.style.overflow = '';
    btn.innerHTML = orig;
    btn.disabled  = false;
  }
}

// ── GENERATE PDF (print with custom filename) ─────────────────
async function generatePDF(btn) {
  const slip = document.querySelector('.tab-pane.active .slip');
  if (!slip) return;

  const nameEl   = slip.querySelector('.slip-name');
  const personName = (nameEl?.textContent || '').trim();
  const periodEl = slip.querySelector('.slip-period');
  const period   = (periodEl?.textContent || '').trim();
  const typeMap  = { coaches:'Coach Payroll', setter:'Setter Payroll' };
  const type     = typeMap[currentTab] || 'Closer Payroll';
  const filename = `${type} ${personName} - ${period}`;

  const origTitle    = document.title;
  document.title     = filename;
  window.print();
  // Restore after a short delay (print dialog is async)
  setTimeout(() => { document.title = origTitle; }, 1000);
}

// ── GENERATE ALL COACH PDFs ───────────────────────────────────
async function generateAllPDFs() {
  const btn = document.getElementById('generate-all-btn');
  const pd  = document.getElementById('co-pay-date')?.value;
  if (!pd) { alert('Please select a Pay Date first.'); return; }

  const select    = document.getElementById('co-coach-select');
  const origCoach = select.value;
  const origTitle = document.title;
  const origText  = btn.innerHTML;
  btn.disabled    = true;

  for (let i = 0; i < COACHES.length; i++) {
    const coach = COACHES[i];
    btn.innerHTML = `⏳ ${i+1}/${COACHES.length} — ${coach}…`;

    // Switch coach and render
    select.value = coach;
    renderCoach();
    await new Promise(r => setTimeout(r, 500));

    // Set filename via title and print
    const slip     = document.querySelector('.tab-pane.active .slip');
    const periodEl = slip?.querySelector('.slip-period');
    const period   = (periodEl?.textContent || '').trim();
    document.title = `Coach Payroll ${coach} - ${period}`;
    window.print();

    // Wait for user to interact with print dialog before next one
    await new Promise(r => setTimeout(r, 1500));
  }

  // Restore
  document.title  = origTitle;
  select.value    = origCoach;
  renderCoach();
  btn.innerHTML   = '✓ All Done!';
  btn.style.background = 'linear-gradient(135deg,#1a9e55,#2ECC71)';
  setTimeout(() => { btn.innerHTML=origText; btn.style.background=''; btn.disabled=false; }, 2500);
}

// ── APPROVE ───────────────────────────────────────────────────
function doApprove(key, type) {
  if(approvedMap[key]) return;
  approvedMap[key]=true;
  try{ localStorage.setItem('ss_payroll_approved',JSON.stringify(approvedMap)); }catch(e){}
  const prefixMap = { closer:'cl', coach:'co', setter:'st' };
  const paneMap   = { closer:'closer', coach:'coaches', setter:'setter' };
  const prefix=prefixMap[type]||'co';
  const paneId=paneMap[type]||'coaches';
  const btn=document.getElementById(prefix+'-approve-btn');
  const dot=document.querySelector(`#pane-${paneId} .status-dot`);
  const txt=document.querySelector(`#pane-${paneId} .status-text`);
  if(btn){btn.textContent='✓ Approved';btn.classList.add('approved');}
  if(dot) dot.classList.add('approved');
  if(txt) txt.textContent='✓ Approved — Ready to send payment';
}

// ── INIT ──────────────────────────────────────────────────────
async function init() {
  try{ salaries=JSON.parse(localStorage.getItem('ss_coach_salaries')||'{}'); }catch(e){}
  try{ approvedMap=JSON.parse(localStorage.getItem('ss_payroll_approved')||'{}'); }catch(e){}
  loadCustomItems();
  document.getElementById('app').style.display='block';
  // Load closer data first (default tab)
  buildControls('closer');
  // Restore base salary BEFORE rendering, so the first paint (and any PDF generated
  // without touching the page first) already reflects the saved value.
  const savedSal=localStorage.getItem('ss_cl_base_salary');
  if(savedSal){ const inp=document.getElementById('cl-base-salary'); if(inp)inp.value=savedSal; }
  showLoading(true);
  try{ await loadCloserData(); await loadSetterDataSafe(); renderCloser(); markUpdated(); }catch(e){ alert('Error: '+e.message); }
  showLoading(false);
}

document.addEventListener('DOMContentLoaded',()=>{
  loadTheme();
  if(isAuth()){ document.getElementById('pw-screen').style.display='none'; init(); }
  else document.getElementById('pw-input').focus();
});
