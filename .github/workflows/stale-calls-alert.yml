name: Stale Confirmed Calls Slack Alert

on:
  schedule:
    # GitHub Actions delays scheduled cron runs, sometimes by a few hours during
    # busy periods -- but the delay only ever pushes it LATER, never earlier.
    # So instead of chasing the exact minute, we schedule ~1h before the real
    # target (8am / 5pm America/New_York) to absorb the typical delay, and the
    # script just sends whenever it actually runs -- no hour-matching rule.
    #
    # NOTE (DST): these are fixed UTC times. Twice a year, when US clocks
    # change, actual local send time will drift by ~1h until this is updated:
    #   - 11:00 UTC = 7am ET during Eastern Daylight Time (used now)
    #   - 20:00 UTC = 4pm ET during Eastern Daylight Time (used now)
    # When EST kicks in (~Nov), bump both by +1 (12:00 / 21:00 UTC) to keep
    # landing around 7am/4pm ET; bump back -1 when EDT resumes (~March).
    - cron: '0 11 * * *' # ~7am ET
    - cron: '0 20 * * *' # ~4pm ET
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-and-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check for stale confirmed calls and alert Slack
        id: check
        env:
          SHEETS_API_KEY: ${{ secrets.SHEETS_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: node scripts/stale-calls-alert/index.mjs
        continue-on-error: true

      - name: Persist run status (for debugging, no secrets in it)
        run: |
          if ! git diff --quiet -- scripts/stale-calls-alert/status.json; then
            git config user.email "actions@github.com"
            git config user.name "Claude"
            git add scripts/stale-calls-alert/status.json
            git commit -m "chore: update stale-calls-alert status.json [skip ci]"
            git push
          fi

      - name: Fail the run if the check step failed
        if: steps.check.outcome == 'failure'
        run: exit 1
