name: Inject Google Tag Manager

on:
  push:
    branches: [main]

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Inject GTM into all HTML files
        run: |
          GTM_HEAD='<!-- Google Tag Manager -->\n<script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'"'"'gtm.start'"'"':\nnew Date().getTime(),event:'"'"'gtm.js'"'"'});var f=d.getElementsByTagName(s)[0],\nj=d.createElement(s),dl=l!='"'"'dataLayer'"'"'?'"'"'&l='"'"'+l:'"'"''"'"';j.async=true;j.src=\n'"'"'https://www.googletagmanager.com/gtm.js?id='"'"'+i+dl;f.parentNode.insertBefore(j,f);\n})(window,document,'"'"'script'"'"','"'"'dataLayer'"'"','"'"'GTM-WHG7DNVZ'"'"');<\/script>\n<!-- End Google Tag Manager -->'

          GTM_BODY='<!-- Google Tag Manager (noscript) -->\n<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WHG7DNVZ"\nheight="0" width="0" style="display:none;visibility:hidden"><\/iframe><\/noscript>\n<!-- End Google Tag Manager (noscript) -->'

          for file in $(find . -name "*.html"); do
            if ! grep -q "GTM-WHG7DNVZ" "$file"; then
              # Inject before </head>
              sed -i "s|</head>|${GTM_HEAD}\n</head>|" "$file"
              # Inject after <body (handles <body> and <body class="..."> etc)
              sed -i "s|<body\([^>]*\)>|<body\1>\n${GTM_BODY}|" "$file"
              echo "✅ GTM injected: $file"
            else
              echo "⏭️  Already has GTM: $file"
            fi
          done

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-inject Google Tag Manager (GTM-WHG7DNVZ)"
          git push
