name: Inject Google Tag Manager

on:
  push:
    branches: [main]

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Inject GTM into all HTML files
        run: python3 .github/scripts/inject_gtm.py

      - name: Commit changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Auto-inject Google Tag Manager (GTM-WHG7DNVZ)"
          git push
